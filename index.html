<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
    <meta name="theme-color" content="#eaf6e4">
    <title>單字怪獸 LinguaMon</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icons/favicon-64.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="單字怪獸">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #eef7ea;
            --card: #ffffff;
            --ink: #24331f;
            --muted: #6b7a66;
            --line: #dfe9da;
            --green: #58b947; --green-d: #3e8e31; --green-t: #e5f5df;
            --orange: #ff9f1c; --orange-d: #d67e00; --orange-t: #fff1dc;
            --red: #ef5a5a; --red-d: #c43d3d; --red-t: #fde7e7;
            --blue: #3b9ae1; --blue-d: #2675b5; --blue-t: #e3f1fc;
            --purple: #8e6cef; --purple-d: #6a4bc9; --purple-t: #efeafd;
            --gold: #ffc93c; --gold-d: #d9a514;
            color-scheme: light;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            margin: 0; background: var(--bg); color: var(--ink);
            font-family: 'Nunito', 'Noto Sans TC', system-ui, sans-serif; font-weight: 700;
            -webkit-font-smoothing: antialiased; overscroll-behavior: none;
        }
        button { font: inherit; color: inherit; cursor: pointer; }
        input, select { font: inherit; }

        /* ===== 立體按鈕 ===== */
        .btn {
            --c: var(--green); --cd: var(--green-d);
            display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
            background: var(--c); color: #fff; border: none; border-radius: 16px;
            box-shadow: 0 4px 0 var(--cd); padding: .9rem 1.2rem; font-weight: 900; letter-spacing: .02em;
            transition: transform .08s, box-shadow .08s, filter .15s; user-select: none;
        }
        .btn:hover { filter: brightness(1.05); }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--cd); }
        .btn:disabled { --c: #c9d3c5; --cd: #aab5a6; cursor: not-allowed; }
        .btn.orange { --c: var(--orange); --cd: var(--orange-d); }
        .btn.red { --c: var(--red); --cd: var(--red-d); }
        .btn.blue { --c: var(--blue); --cd: var(--blue-d); }
        .btn.purple { --c: var(--purple); --cd: var(--purple-d); }
        .btn.white { --c: #fff; --cd: var(--line); color: var(--ink); border: 2px solid var(--line); }
        .btn.sm { padding: .5rem .8rem; border-radius: 12px; font-size: .85rem; box-shadow: 0 3px 0 var(--cd); }
        .btn.sm:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--cd); }

        .card { background: var(--card); border: 2px solid var(--line); border-radius: 22px; }
        .pill { display: inline-flex; align-items: center; gap: .3rem; border-radius: 999px; padding: .3rem .7rem; font-weight: 900; font-size: .85rem; }

        /* ===== 選項按鈕 ===== */
        .opt {
            width: 100%; text-align: left; background: #fff; border: 2px solid var(--line); border-bottom-width: 5px;
            border-radius: 16px; padding: .95rem 1rem; font-size: 1.05rem; font-weight: 800; display: flex; align-items: center; gap: .7rem;
            transition: transform .08s, border-color .15s, background .15s;
        }
        .opt:hover:not(:disabled) { border-color: #b9d7f0; background: #f6fbff; }
        .opt:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 3px; }
        .opt .k { flex-shrink: 0; width: 1.7rem; height: 1.7rem; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-size: .75rem; color: var(--muted); }
        .opt.ok { border-color: var(--green); background: var(--green-t); color: var(--green-d); }
        .opt.bad { border-color: var(--red); background: var(--red-t); color: var(--red-d); animation: shake .4s; }
        .opt:disabled { cursor: default; }
        .opt.center { justify-content: center; text-align: center; }

        /* ===== 字母方塊 ===== */
        .tile {
            min-width: 2.8rem; height: 3rem; padding: 0 .6rem; border-radius: 12px; background: #fff; border: 2px solid var(--line); border-bottom-width: 5px;
            font-size: 1.35rem; font-weight: 900; display: grid; place-items: center; text-transform: lowercase; transition: transform .08s, opacity .15s;
        }
        .tile:active { transform: translateY(2px); border-bottom-width: 3px; }
        .tile.used { opacity: .25; pointer-events: none; }
        .slot { min-width: 2.2rem; height: 3rem; border-bottom: 4px solid #c9d6c3; display: grid; place-items: center; font-size: 1.5rem; font-weight: 900; margin: 0 2px; }
        .slot.fixed { border-color: transparent; color: var(--muted); min-width: 1rem; }
        .slot.filled { color: var(--blue-d); border-color: var(--blue); }

        /* ===== 怪獸 ===== */
        .monster-wrap { position: relative; display: inline-block; line-height: 1; cursor: pointer; user-select: none; }
        .monster { display: inline-block; animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 100%; filter: drop-shadow(0 10px 0 rgba(36, 51, 31, .08)); }
        .monster-wrap.hop .monster { animation: hop .5s; }
        .acc { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; animation: bob 2.6s ease-in-out infinite; }
        .acc.head { top: -32%; }
        .acc.face { top: 22%; }
        /* Q 版圖：配件依每個型態的臉部錨點定位（left/top/rotate 由 accHTML 寫在 style） */
        .acc.fit { line-height: 1; }
        .shadow { width: 60%; height: 12px; margin: 4px auto 0; border-radius: 50%; background: rgba(36,51,31,.10); animation: shadow 2.6s ease-in-out infinite; }
        @keyframes bob { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.02, .98); } }
        .acc { animation-name: bobacc; }
        @keyframes bobacc { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -8px); } }
        @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.85); opacity: .7; } }
        @keyframes hop { 0% { transform: translateY(0); } 35% { transform: translateY(-28px) rotate(-6deg); } 70% { transform: translateY(0) scale(1.08, .92); } 100% { transform: none; } }

        .bubble { position: relative; background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: .6rem .9rem; font-size: .95rem; }
        .bubble::after { content: ''; position: absolute; left: 50%; bottom: -9px; width: 14px; height: 14px; background: #fff; border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: translateX(-50%) rotate(45deg); }

        /* ===== 怪獸動作 ===== */
        .monster-wrap.a-jump { animation: aJump .7s ease; }
        @keyframes aJump { 30% { transform: translateY(-42px) scale(.95, 1.05); } 55% { transform: translateY(0) scale(1.12, .88); } 75% { transform: translateY(-10px); } }
        .monster-wrap.a-spin { animation: aSpin .9s ease-in-out; }
        @keyframes aSpin { 40% { transform: translateY(-18px) rotate(200deg); } 100% { transform: rotate(360deg); } }
        .monster-wrap.a-look { animation: aLook 1.8s ease-in-out; }
        @keyframes aLook { 20%, 45% { transform: scaleX(-1); } 55%, 100% { transform: none; } }
        .monster-wrap.a-walk { animation: aWalk 3s ease-in-out; }
        @keyframes aWalk { 25% { transform: translateX(-55px); } 30% { transform: translateX(-55px) scaleX(-1); } 70% { transform: translateX(55px) scaleX(-1); } 75% { transform: translateX(55px); } }
        .monster-wrap.a-wiggle { animation: wiggle .45s ease-in-out 2; }
        .monster-wrap.a-chomp { animation: aChomp .7s ease; }
        @keyframes aChomp { 15%, 55% { transform: scale(1.18, .84); } 35%, 75% { transform: scale(.9, 1.1); } }
        .monster-wrap.sleeping .monster { animation: breathe 3.2s ease-in-out infinite; filter: brightness(.8) saturate(.8); }
        @keyframes breathe { 50% { transform: scale(1.04, .96); } }
        .zzz { position: absolute; right: 18%; top: 0; font-size: 1.5rem; pointer-events: none; animation: zzz 2.6s linear infinite; }
        .zzz:nth-child(2) { animation-delay: 1.3s; }
        @keyframes zzz { 0% { transform: translate(0, 10px) scale(.5); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(34px, -60px) scale(1.2); opacity: 0; } }
        .thought { position: absolute; right: 14%; top: 4%; background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: .2rem .5rem; font-size: 1.4rem; animation: pop .3s, fade .4s 2.2s reverse forwards; pointer-events: none; }
        .food-fly { position: absolute; left: 50%; bottom: 0; font-size: 2.6rem; pointer-events: none; animation: foodFly .65s cubic-bezier(.3,.7,.4,1) forwards; }
        @keyframes foodFly { 0% { transform: translate(-50%, 0) scale(.6) rotate(-20deg); } 70% { transform: translate(-50%, -140px) scale(1.1) rotate(10deg); } 100% { transform: translate(-50%, -110px) scale(0); opacity: 0; } }
        .evo-flash { display: inline-block; animation: evoFlash 2s ease-in forwards; }
        @keyframes evoFlash { 0% { filter: none; } 15%, 35%, 55%, 75% { filter: brightness(0) invert(1) drop-shadow(0 0 14px #ffd43b); } 25%, 45%, 65% { filter: none; } 100% { filter: brightness(0) invert(1) drop-shadow(0 0 40px #ffd43b); transform: scale(1.35); } }
        .reveal { display: inline-block; animation: reveal .7s cubic-bezier(.2,1.5,.4,1); }
        @keyframes reveal { from { transform: scale(.2) rotate(-30deg); filter: brightness(3); } }
        .crack { position: absolute; inset: 0; display: grid; place-items: center; font-size: 2.2rem; pointer-events: none; }

        /* ===== 小遊戲 ===== */
        .arena { position: relative; overflow: hidden; border-radius: 22px; border: 2px solid var(--line); touch-action: none; user-select: none; -webkit-user-select: none; }
        .arena.hurt { animation: shake .35s; }
        .fall { position: absolute; top: 0; transform: translateX(-50%); padding: .35rem .75rem; border-radius: 12px; background: #fff; border: 2px solid var(--line); border-bottom-width: 4px; font-weight: 900; white-space: nowrap; pointer-events: none; }
        .bub { position: absolute; border-radius: 50%; display: grid; place-items: center; text-align: center; font-weight: 900; line-height: 1.1; padding: 8px; cursor: pointer;
            background: radial-gradient(circle at 32% 28%, #ffffff 0 14%, #e4f3ff 30%, #b9defc 75%, #9ccff8 100%); border: 2px solid #a8d6fb; color: #1f4e7a; box-shadow: inset -6px -8px 0 rgba(255,255,255,.35); }
        .bub.pop { animation: popOut .22s forwards; pointer-events: none; }
        .bub.no { animation: shake .3s; }
        @keyframes popOut { to { transform: scale(1.6); opacity: 0; } }
        .score-pop { position: absolute; font-weight: 900; font-size: 1.3rem; pointer-events: none; animation: scorePop .8s ease-out forwards; }
        @keyframes scorePop { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -50px); opacity: 0; } }
        .mcard { aspect-ratio: 4 / 5; perspective: 700px; border: none; background: none; padding: 0; }
        .mcard-in { position: relative; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d; }
        .mcard.flip .mcard-in { transform: rotateY(180deg); }
        .mface { position: absolute; inset: 0; border-radius: 16px; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; font-weight: 900; padding: 6px; text-align: center; word-break: break-word; }
        .mback { background: var(--green); box-shadow: 0 4px 0 var(--green-d); font-size: 2rem; }
        .mfront { background: #fff; border: 2px solid var(--line); transform: rotateY(180deg); font-size: .95rem; }
        .mcard.done .mfront { background: var(--green-t); border-color: var(--green); color: var(--green-d); }
        .mcard.miss .mfront { border-color: var(--red); background: var(--red-t); }

        /* ===== Fluent 3D 圖示 ===== */
        .fe { display: inline-block; width: 1.15em; height: 1.15em; vertical-align: -0.22em; object-fit: contain; pointer-events: none; user-select: none; -webkit-user-drag: none; }
        .monster .fe, .acc .fe, .b-mon .fe, .monster-wrap .fe { width: 1em; height: 1em; vertical-align: bottom; }
        .tab .ico .fe { width: 1.7rem; height: 1.7rem; vertical-align: middle; }
        /* Q 版原創美術：圖已裁到貼邊，放大一點讓角色更有存在感 */
        .fe.art { width: 1.3em; height: 1.3em; vertical-align: -0.3em; }
        .monster .fe.art, .b-mon .fe.art, .monster-wrap .fe.art { width: 1.15em; height: 1.15em; vertical-align: bottom; }

        /* ===== 場景（純 CSS，不用 SVG） ===== */
        .scene { position: relative; overflow: hidden; background: linear-gradient(180deg, var(--sky-a) 0%, var(--sky-b) 100%); }
        .scene::before { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
            background:
                radial-gradient(150px 150px at 90% -6%, rgba(255, 236, 150, .55), transparent 70%),
                radial-gradient(34px 16px at 16% 9%, rgba(255,255,255,.95) 70%, transparent 72%),
                radial-gradient(48px 20px at 23% 7%, rgba(255,255,255,.95) 70%, transparent 72%),
                radial-gradient(30px 14px at 29% 10%, rgba(255,255,255,.95) 70%, transparent 72%),
                radial-gradient(40px 16px at 72% 15%, rgba(255,255,255,.8) 70%, transparent 72%),
                radial-gradient(54px 20px at 80% 13%, rgba(255,255,255,.8) 70%, transparent 72%);
            animation: drift 18s ease-in-out infinite alternate; }
        @keyframes drift { to { transform: translateX(22px); } }
        .scene::after { content: ''; position: absolute; left: -15%; right: -15%; top: 250px; bottom: 0; pointer-events: none; z-index: 0;
            border-radius: 50% 50% 0 0 / 70px 70px 0 0;
            background: radial-gradient(ellipse 30% 26px at 50% 8px, rgba(0,0,0,.08), transparent 70%), linear-gradient(180deg, var(--ground) 0, var(--ground-d) 100%);
            box-shadow: inset 0 6px 0 rgba(255,255,255,.35); }
        .scene > * { position: relative; z-index: 1; }
        .scene > .deco { position: absolute; }
        .scene.dark #mon-bubble, .scene.dark .bubble { color: var(--ink); }
        .trail { border-radius: 26px; background: radial-gradient(circle at 2px 2px, rgba(36,51,31,.07) 1.5px, transparent 0) 0 0 / 20px 20px, linear-gradient(180deg, var(--rt) 0%, rgba(255,255,255,0) 100%); }

        /* ===== 競技場 ===== */
        .battle-field { position: relative; height: 290px; border-radius: 22px; overflow: hidden; border: 2px solid var(--line);
            background: radial-gradient(ellipse 60% 18% at 78% 47%, rgba(120,170,90,.45), transparent 70%),
                        radial-gradient(ellipse 65% 18% at 25% 92%, rgba(120,170,90,.5), transparent 70%),
                        linear-gradient(180deg, #bfe3ff 0%, #e6f6ff 45%, #d4efc4 46%, #bfe3a8 100%); }
        .b-mon { position: absolute; font-size: 84px; line-height: 1; animation: bob 2.4s ease-in-out infinite; }
        .b-mon.me { font-size: 96px; }
        .b-mon.me > span { display: inline-block; transform: scaleX(-1); }
        .b-mon.hit { animation: hitFlash .45s; }
        @keyframes hitFlash { 0%, 100% { opacity: 1; } 20%, 60% { opacity: .2; transform: translateX(-6px); } 40%, 80% { opacity: 1; transform: translateX(6px); } }
        .b-mon.lunge-me { animation: lungeMe .4s ease; }
        @keyframes lungeMe { 50% { transform: translate(60px, -40px); } }
        .b-mon.lunge-foe { animation: lungeFoe .4s ease; }
        @keyframes lungeFoe { 50% { transform: translate(-60px, 40px); } }
        .b-shadow { position: absolute; width: 90px; height: 14px; border-radius: 50%; background: rgba(36,51,31,.18); }
        .hp-card { position: absolute; width: 46%; background: rgba(255,255,255,.92); border: 2px solid var(--line); border-radius: 14px; padding: 6px 10px; z-index: 2; }
        .move { width: 100%; display: flex; align-items: center; gap: .7rem; padding: .7rem .9rem; border-radius: 16px; background: #fff; border: 2px solid var(--line); border-bottom-width: 5px; font-weight: 800; transition: transform .08s; }
        .move:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 3px; }
        .move:disabled { opacity: .45; cursor: not-allowed; }

        .badge { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: .55rem .2rem .45rem; border-radius: 16px; background: #f6f9f4; border: 2px solid var(--line); }
        .badge.got { background: linear-gradient(180deg, #fffbea, #fff1c2); border-color: #f3d77b; box-shadow: 0 3px 0 #e8c75a; }
        .badge .b-ico { font-size: 1.9rem; line-height: 1.1; }
        .badge .b-name { font-size: .65rem; font-weight: 900; text-align: center; line-height: 1.2; }
        .badge .b-bar { width: 80%; height: 4px; border-radius: 4px; background: #e3ebdf; overflow: hidden; margin-top: 2px; }
        .badge .b-bar i { display: block; height: 100%; background: var(--gold); }

        .float-heart { position: absolute; bottom: 40%; font-size: 1.6rem; pointer-events: none; animation: floatUp 1.3s ease-out forwards; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-110px) scale(1.2); opacity: 0; } }
        .deco { position: absolute; font-size: 1.6rem; opacity: .55; pointer-events: none; }
        .act { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: .6rem .2rem; border-radius: 16px; background: rgba(255,255,255,.85); border: 2px solid var(--line); border-bottom-width: 4px; font-size: .78rem; font-weight: 900; transition: transform .08s; }
        .act:active { transform: translateY(2px); border-bottom-width: 2px; }
        .act .i { font-size: 1.6rem; line-height: 1.1; }
        .mini { flex-shrink: 0; width: 76px; text-align: center; padding: .5rem .2rem; border-radius: 16px; background: #fff; border: 2px solid var(--line); }
        .mini.on { border-color: var(--green); background: var(--green-t); }

        /* ===== 進度條 ===== */
        .bar { height: 14px; background: #e3ebdf; border-radius: 999px; overflow: hidden; }
        .bar > i { display: block; height: 100%; border-radius: 999px; background: var(--green); transition: width .5s cubic-bezier(.3,1.3,.5,1); position: relative; }
        .bar > i::after { content: ''; position: absolute; left: 8px; right: 8px; top: 3px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.4); }

        /* ===== 地圖節點 ===== */
        .node { position: relative; width: 74px; height: 68px; border-radius: 50%; border: none; display: grid; place-items: center; font-size: 1.7rem; color: #fff;
            background: var(--nc, var(--green)); box-shadow: 0 7px 0 var(--ncd, var(--green-d)); transition: transform .1s, box-shadow .1s; }
        .node:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ncd, var(--green-d)); }
        .node.locked { --nc: #d5ddd1; --ncd: #b7c2b2; color: #95a290; cursor: not-allowed; }
        .node.boss { width: 92px; height: 84px; font-size: 2.4rem; }
        .node.current::before { content: ''; position: absolute; inset: -9px; border-radius: 50%; border: 4px solid var(--nc, var(--green)); opacity: .35; animation: ring 1.6s ease-out infinite; }
        @keyframes ring { from { transform: scale(.9); opacity: .5; } to { transform: scale(1.25); opacity: 0; } }
        .node-stars { position: absolute; bottom: -26px; left: 50%; transform: translateX(-50%); font-size: .8rem; white-space: nowrap; letter-spacing: -1px; }
        .start-tag { position: absolute; top: -40px; left: 50%; transform: translateX(-50%); background: #fff; border: 2px solid var(--line); color: var(--nc); border-radius: 12px; padding: .25rem .6rem; font-size: .8rem; font-weight: 900; white-space: nowrap; animation: float 1.6s ease-in-out infinite; }
        .start-tag::after { content: ''; position: absolute; left: 50%; bottom: -7px; width: 10px; height: 10px; background: #fff; border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: translateX(-50%) rotate(45deg); }
        @keyframes float { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -5px); } }

        /* ===== 底部導航 ===== */
        .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #fff; border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
        .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: .55rem 0 .5rem; font-size: .72rem; color: var(--muted); border: none; background: none; border-radius: 14px; }
        .tab .ico { font-size: 1.5rem; line-height: 1; filter: grayscale(.85); opacity: .7; transition: transform .15s; }
        .tab.active { color: var(--green-d); }
        .tab.active .ico { filter: none; opacity: 1; transform: translateY(-2px) scale(1.1); }

        /* ===== 遊戲覆蓋層 ===== */
        .overlay { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; }
        .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom)); transform: translateY(110%); transition: transform .25s cubic-bezier(.2,.9,.3,1.1); }
        .sheet.show { transform: none; }
        .sheet.good { background: #d7f2cf; }
        .sheet.bad { background: #fbdcdc; }

        .modal-bg { position: fixed; inset: 0; z-index: 60; background: rgba(30, 45, 25, .45); display: flex; align-items: center; justify-content: center; padding: 1rem; animation: fade .2s; }
        .modal { width: 100%; max-width: 420px; max-height: 90dvh; overflow-y: auto; animation: pop .35s cubic-bezier(.2,1.4,.4,1); }

        @keyframes fade { from { opacity: 0; } }
        @keyframes pop { from { transform: scale(.85); opacity: 0; } }
        @keyframes slideUp { from { transform: translateY(18px); opacity: 0; } }

        let v = 0;

        if (v >= a.goal) {
            S.ach[a.id] = Date.now();
            S.coins += a.coins;

    }

const $ = id => document.getElementById(id);
function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
function safeParse(s) { try { return JSON.parse(s); } catch { return null; } }
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function norm(s) { return String(s || '').toLowerCase().normalize('NFKC').replace(/[’‘]/g, "'").replace(/[^a-z']/g, ''); }
function dateStr(d = new Date()) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function yesterday() { const d = new Date(); d.setDate(d.getDate() - 1); return dateStr(d); }

// 美術：把 emoji 換成 Microsoft Fluent Emoji 3D 圖示（MIT 授權，PNG）
// 載入失敗時自動退回原本的 emoji 文字
// ============================================================
const FLUENT_CDN = 'https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/';

// Q 版原創美術（art/*.webp）：怪獸 24 張 + 魔王 20 張
// 每張圖配一個私用區字元當代號，走跟 Fluent 圖示同一條替換流程；圖檔載入失敗時退回原本的 emoji
const ART = {};
function artChar(file, fallback) {
    const ch = String.fromCodePoint(0xE000 + Object.keys(ART).length);
    ART[ch] = { src: `art/${file}.webp`, fb: fallback };
    FLUENT[ch] = '@';
    return ch;
}
SPECIES.forEach(s => s.forms.forEach((f, i) => { f.e = artChar(`sp_${s.id}_${i + 1}`, f.e); }));
REGIONS.forEach(r => { r.boss = artChar(`boss_${r.id}`, r.boss); });
SPECIES.forEach(s => Object.entries(s.alt).forEach(([b, f]) => { f.e = artChar(`sp_${s.id}_${b}`, f.e); }));

function fluentUrl(e) {
    if (ART[e]) return ART[e].src;
    const v = FLUENT[e] || FLUENT[e + '️'] || FLUENT[e.replace(/️/g, '')];
    if (!v) return null;
    const skin = v[0] === '!';
    const [folder, slug] = (skin ? v.slice(1) : v).split('|');
    return `${FLUENT_CDN}${encodeURIComponent(folder)}/${skin ? 'Default/' : ''}3D/${slug}_3d${skin ? '_default' : ''}.png`;
}
const FLUENT_RE = new RegExp('(' + Object.keys(FLUENT)
    .flatMap(k => [k, k.replace(/️/g, '')])
    .filter((k, i, a) => k && a.indexOf(k) === i)
    .sort((a, b) => b.length - a.length)
    .map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\uFE0F?')
    .join('|') + ')', 'gu');
const FLUENT_TEST = new RegExp(FLUENT_RE.source, 'u');
const FLUENT_SKIP = new Set(['SCRIPT', 'STYLE', 'TEXTAREA', 'INPUT', 'OPTION', 'SELECT', 'TITLE', 'NOSCRIPT']);
let fluentOn = true;

function fluentImg(e) {
    const img = document.createElement('img');
    const art = ART[e];
    img.className = art ? 'fe art' : 'fe';
    img.alt = art ? art.fb : e;
    img.draggable = false;
    img.decoding = 'async';
    img.src = fluentUrl(e);
    img.onerror = () => img.replaceWith(art ? fluentImg(art.fb) : document.createTextNode(e));
    return img;
}

function fluentify(root) {
    if (!fluentOn || !root) return;
    if (root.nodeType === 3) { fluentText(root); return; }
    if (root.nodeType !== 1 || FLUENT_SKIP.has(root.nodeName) || root.closest?.('.no-fe')) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode: n => (n.parentElement && !FLUENT_SKIP.has(n.parentElement.nodeName) && !n.parentElement.closest('.no-fe') && FLUENT_TEST.test(n.data)) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
    });
    const list = [];
    while (walker.nextNode()) list.push(walker.currentNode);
    list.forEach(fluentText);
}

function fluentText(node) {
    const p = node.parentElement;
    if (!p || FLUENT_SKIP.has(p.nodeName) || p.closest('.no-fe')) return;
    const text = node.data;
    if (!FLUENT_TEST.test(text)) return;
    FLUENT_RE.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = FLUENT_RE.exec(text))) {
        if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        frag.appendChild(fluentUrl(m[0]) ? fluentImg(m[0]) : document.createTextNode(m[0]));
        last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.replaceWith(frag);
}

new MutationObserver(muts => {
    if (!fluentOn) return;
    for (const mu of muts) {
        if (mu.type === 'characterData') fluentText(mu.target);
        else mu.addedNodes.forEach(n => { if (n.nodeType === 1 && n.classList?.contains('fe')) return; fluentify(n); });
    }
}).observe(document.body, { childList: true, subtree: true, characterData: true });
fluentify(document.body);

function toast(msg, type = 'info', ms = 2600) {
    const color = { info: ['#fff', 'var(--ink)'], good: ['#d7f2cf', 'var(--green-d)'], bad: ['#fbdcdc', 'var(--red-d)'], gold: ['#fff1c2', '#8a6500'] }[type];
    const el = document.createElement('div');
    el.className = 'toast card px-4 py-3 text-sm font-black shadow-lg pointer-events-auto w-full text-center';
    el.style.background = color[0]; el.style.color = color[1];
    el.textContent = msg;
    $('toasts').appendChild(el);
    setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, ms);
}

function defaultState() {
    return {
        v: 3, level: 'A1', coins: 0, streak: 0, lastActive: null, sound: true, rate: 0.85,
        mons: [], active: null, eggs: [], seen: [],
        foods: { apple: 3, candy: 1, meat: 0, cake: 0 },
        owned: [], bg: 'meadow', bgs: ['meadow'],
        progress: {}, dex: {},
        daily: { date: dateStr(), caught: 0, stages: 0, reviews: 0, claimed: [] },
        totals: { correct: 0, answered: 0 },
        stats: {}, ach: {}, arena: { rank: 0, wins: 0, losses: 0, trophies: 0 }, forms: {},
        legacy: []
    };
}

function newMon(species, extra = {}) {
    const sp = SPECIES.find(s => s.id === species) || SPECIES[0];
    return {
        id: Math.random().toString(36).slice(2, 9), species: sp.id, name: sp.forms[0].n,
        xp: 0, satiety: 70, fedAt: Date.now(), mood: 70, moodAt: Date.now(),
        affection: 0, petDay: '', pets: 0, head: null, face: null,
        shiny: Math.random() < 0.08, trait: pick(TRAITS).id, born: Date.now(), ...extra
    };
}

// 把 v2（單一怪獸）存檔升級為 v3（多隻怪獸養成）
function migrate(saved) {
    const base = defaultState();
    if (!saved || typeof saved !== 'object') return null;
    if (saved.v === 3) {
        return { ...base, ...saved, foods: { ...base.foods, ...saved.foods }, daily: { ...base.daily, ...saved.daily }, totals: { ...base.totals, ...saved.totals },
            stats: { ...saved.stats }, ach: { ...saved.ach }, arena: { ...base.arena, ...saved.arena } };
    }
    if (saved.v === 2) {
        const m = saved.monster || {};
        const mon = newMon('dragon', { name: m.name || '毛毛', xp: m.xp || 0, satiety: m.satiety ?? 70, fedAt: m.fedAt || Date.now(), head: m.head || null, face: m.face || null, shiny: false });
        const out = { ...base, ...saved, v: 3, mons: [mon], active: mon.id, seen: ['dragon'], owned: m.owned || [],
            daily: { ...base.daily, ...saved.daily }, totals: { ...base.totals, ...saved.totals } };
        delete out.monster;
        return out;
    }
    return null;
}

function loadState() {
    const base = defaultState();
    const saved = migrate(safeParse(safeGet(STORE_KEY)));
    if (saved) return saved;
    // 從舊版 LinguaMax 搬資料：XP 換成金幣、已學單字列入排除清單
    const old = safeParse(safeGet('linguamax_user'));
    if (old) {
        base.coins = Math.min(500, Math.floor((Number(old.xp) || 0) / 5));
        base.streak = Number(old.streak) || 0;
        base.legacy = Object.values(old.learnedHistory || {}).flat().filter(w => typeof w === 'string').slice(-300);
    }
    return base;
}

const S = loadState();

let model = safeGet(MODEL_STORE) || DEFAULT_MODEL;
const G = { tab: 'home', mapRegion: null, dexRegion: 'all', dexQuery: '', dexMode: 'words', shopTab: 'food', play: null, modalQueue: [], modalOpen: false, prefetch: {}, chat: { scenario: CHAT_SCENARIOS[0], history: [], busy: false, started: false } };

function save() { checkAchievements(); safeSet(STORE_KEY, JSON.stringify(S)); renderTop(); }

function ensureDaily() {
    if (S.daily.date !== dateStr()) S.daily = { date: dateStr(), caught: 0, stages: 0, reviews: 0, claimed: [] };
    if (S.lastActive && S.lastActive !== dateStr() && S.lastActive !== yesterday()) S.streak = 0;
}

function markActive() {
    const today = dateStr();
    if (S.lastActive === today) return;
    S.streak = S.lastActive === yesterday() ? S.streak + 1 : 1;
    S.lastActive = today;
    if (S.streak > 1) toast(`🔥 連續 ${S.streak} 天！`, 'gold');
}

function bumpQuest(id, n = 1) {
    ensureDaily();
    const q = QUESTS.find(x => x.id === id);
    const before = S.daily[id] || 0;
    S.daily[id] = before + n;
    if (q && before < q.target && S.daily[id] >= q.target) toast(`${q.icon} 每日任務完成：${q.text}，回小屋領獎勵！`, 'gold', 3200);
}

function activeMon() { return S.mons.find(m => m.id === S.active) || S.mons[0] || null; }
function speciesOf(m) { return SPECIES.find(s => s.id === m?.species) || SPECIES[0]; }
function traitOf(m) { return TRAITS.find(t => t.id === m?.trait) || TRAITS[0]; }
function xpToNext(lv) { return 30 + lv * 20; }
function levelInfo(m = activeMon()) {
    let lv = 1, rest = m?.xp || 0;
    while (rest >= xpToNext(lv)) { rest -= xpToNext(lv); lv++; }
    return { lv, cur: rest, need: xpToNext(lv) };
}
function formIdx(lv) { return lv >= FORM_LV[2] ? 2 : lv >= FORM_LV[1] ? 1 : 0; }
function isFinal(m) { return formIdx(levelInfo(m).lv) === 2; }
function branchOf(m) { return m && isFinal(m) && speciesOf(m).alt[m.branch] ? m.branch : 'base'; }
function branchMeta(id) { return BRANCHES.find(b => b.id === id) || BRANCHES[0]; }
function branchScore(m, b) { return b === 'guard' ? (m.affection || 0) / BRANCH_NEED.guard : b === 'battle' ? (m.wins || 0) / BRANCH_NEED.battle : 1; }
function pickBranch(m) { const g = branchScore(m, 'guard'), w = branchScore(m, 'battle'); return Math.max(g, w) < 1 ? 'base' : w > g ? 'battle' : 'guard'; }
function branchForm(sp, b) { return b === 'base' ? sp.forms[2] : sp.alt[b]; }
function markForm(m) { if (isFinal(m)) S.forms[`${m.species}_${branchOf(m)}`] = 1; }
function formOf(m = activeMon()) { const sp = speciesOf(m), i = formIdx(levelInfo(m).lv); return i === 2 ? branchForm(sp, branchOf(m)) : sp.forms[i]; }
function setBranch(id, b) {
    const m = S.mons.find(x => x.id === id);
    if (!m || !isFinal(m) || branchScore(m, b) < 1 || branchOf(m) === b) return;
    const old = formOf(m);
    m.branch = b;
    if (m.name === old.n) m.name = formOf(m).n;
    markForm(m);
    playSound('levelup'); burst();
    save(); render(); closeModal(); openMon(id);
    toast(`${formOf(m).e} 變成${branchMeta(b).name}的${formOf(m).n}了！`, 'good', 3000);
}
function monBattleStats(m) {
    const s = battleStats(levelInfo(m).lv, m.species), b = isFinal(m) ? branchOf(m) : '';
    if (b === 'guard') s.max = Math.round(s.max * 1.2);
    if (b === 'battle') s.atk = Math.round(s.atk * 1.15);
    return s;
}
function nextForm(m = activeMon()) { const i = formIdx(levelInfo(m).lv); return i < 2 ? { ...speciesOf(m).forms[i + 1], lv: FORM_LV[i + 1] } : null; }

function satiety(m = activeMon()) {
    if (!m) return 0;
    return Math.max(0, Math.round(m.satiety - (Date.now() - m.fedAt) / 3600000 * 2));
}
function mood(m = activeMon()) {
    if (!m) return 0;
    const rate = m.trait === 'lively' ? 1.5 : 3;
    return Math.max(0, Math.round(m.mood - (Date.now() - m.moodAt) / 3600000 * rate));
}
function feed(n, m = activeMon()) { if (!m) return; m.satiety = Math.min(100, satiety(m) + n); m.fedAt = Date.now(); }
function cheer(n, m = activeMon()) { if (!m) return; m.mood = Math.min(100, mood(m) + n); m.moodAt = Date.now(); }
function hearts(m = activeMon()) { return Math.min(5, Math.floor((m?.affection || 0) / 20)); }
function addAffection(n, m = activeMon()) {
    if (!m) return;
    const before = m.affection;
    m.affection = Math.min(100, m.affection + n);
    if (before < 100 && m.affection >= 100 && !S.owned.includes('scarf')) {
        S.owned.push('scarf');
        G.modalQueue.push(() => giftModal(m));
    } else if (Math.floor(m.affection / 20) > Math.floor(before / 20)) {
        toast(`💞 和 ${m.name} 的親密度升到 ${hearts(m)} 顆心！`, 'good');
    }
    if (before < BRANCH_NEED.guard && m.affection >= BRANCH_NEED.guard && isFinal(m)) toast(`🛡️ ${m.name} 可以變成守護型了！點名字切換型態`, 'gold', 3600);
}

// 經驗加成：學霸 +15%、心情好 +20%、肚子餓減半
function xpMultiplier(m = activeMon()) {
    let k = 1;
    if (m?.trait === 'smart') k *= 1.15;
    if (m && isFinal(m) && branchOf(m) === 'base') k *= 1.1;
    if (mood(m) >= 70) k *= 1.2;
    if (satiety(m) < 20) k *= 0.5;
    return k;
}
function addMonsterXP(n) {
    const m = activeMon();
    if (!m) return 0;
    const gain = Math.max(1, Math.round(n * xpMultiplier(m)));
    const before = levelInfo(m);
    m.xp += gain;
    const after = levelInfo(m);
    if (after.lv > before.lv) {
        const fb = formIdx(before.lv), fa = formIdx(after.lv);
        if (fa !== fb) {
            const oldName = m.name;
            // 沒改過名字的怪獸，名字跟著型態一起進化
            if (fa === 2) m.branch = pickBranch(m);
            if (oldName === speciesOf(m).forms[fb].n) m.name = formOf(m).n;
            markForm(m);
            G.modalQueue.push(() => evolutionModal(m, fb, fa, oldName));
        }
        else G.modalQueue.push(() => levelUpModal(m, after.lv));
        const learned = (SKILLS[m.species] || []).filter((_, i) => SKILL_LV[i] > before.lv && SKILL_LV[i] <= after.lv);
        if (learned.length) G.modalQueue.push(() => skillModal(m, learned));
    }
    return gain;
}

function emojiStyle(m) { return m?.shiny ? 'filter:hue-rotate(150deg) saturate(1.4);' : ''; }
function eggStyle(sp) { return `filter:hue-rotate(${sp.hue}deg) saturate(${sp.rare ? 2 : 1.3});`; }

// 配件錨點（單位：圖片邊長的 %），每族 3 個型態：
// [眼睛中心 x, y, 雙眼外緣寬度, 臉的傾斜角度, 頭頂 x, y, 頭寬]
const ACC_POS = {
    dragon: [[48, 51, 42, 8, 45, 24, 60], [34, 36, 33, 5, 35, 18, 40], [38, 34, 23, 0, 38, 21, 28]],
    sea:    [[37, 65, 44, 6, 42, 33, 60], [38, 36, 40, 11, 40, 13, 55], [32, 58, 34, 4, 43, 31, 50]],
    cat:    [[43, 49, 46, 15, 44, 16, 55], [29, 45, 35, 3, 27, 22, 38], [35, 42, 28, 0, 37, 10, 40]],
    bird:   [[44, 51, 38, 7, 44, 26, 60], [42, 48, 35, 11, 38, 27, 50], [37, 40, 26, 0, 36, 26, 38]],
    bunny:  [[36, 60, 39, 7, 33, 35, 55], [30, 45, 31, 3, 30, 26, 42], [34, 52, 27, 3, 33, 28, 36]],
    bug:    [[37, 49, 42, 2, 36, 23, 62], [36, 52, 40, 10, 38, 22, 50], [37, 46, 24, 4, 38, 30, 34]],
    dino:   [[43, 42, 44, 6, 45, 16, 65], [29, 29, 30, 13, 30, 10, 42], [40, 30, 26, 8, 37, 11, 40]],
    ghost:  [[43, 50, 38, 12, 46, 23, 60], [43, 53, 34, 9, 50, 17, 60], [41, 38, 32, 0, 40, 18, 50]]
};
// 每種配件的大小與擺法：s = 相對眼寬（臉部）或頭寬（頭部）的比例；up = 往上抬多少個自身高度；dx/dy = 以頭寬／眼寬為單位的位移
// 分支最終型態的錨點（格式同上）
const ACC_ALT = {
    dragon: { guard: [41, 42, 30, 0, 42, 26, 38],  battle: [39, 47, 28, -5, 40, 31, 32] },
    sea:    { guard: [24, 43, 32, 3, 27, 18, 42],  battle: [34, 54, 34, -6, 38, 31, 44] },
    cat:    { guard: [34, 45, 34, 4, 37, 22, 46],  battle: [37, 49, 40, -4, 36, 26, 50] },
    bird:   { guard: [41, 36, 32, -3, 42, 15, 44], battle: [32, 55, 26, -8, 36, 32, 36] },
    bunny:  { guard: [41, 39, 28, 12, 44, 20, 40], battle: [41, 54, 32, -3, 42, 32, 46] },
    bug:    { guard: [35, 43, 32, 10, 41, 21, 46], battle: [47, 52, 34, -9, 55, 30, 44] },
    dino:   { guard: [27, 45, 32, 0, 28, 24, 44],  battle: [26, 35, 36, -8, 33, 11, 44] },
    ghost:  { guard: [36, 41, 32, 10, 40, 19, 46], battle: [42, 45, 36, 0, 42, 23, 44] }
};
const ACC_FIT = {
    glasses: { s: 1.2 }, shades: { s: 1.2 }, scarf: { s: .8, dy: .55 },
    crown: { s: .6, up: .38 }, tophat: { s: .7, up: .3 }, grad: { s: .8, up: .25 }, cap: { s: .8, up: .05 },
    bow: { s: .5, up: .2 }, flower: { s: .4, up: .1, dx: .3 }, phones: { s: 1.1, up: -.3 }
};
function accHTML(m, it, size, accSize) {
    const br = branchOf(m), f = ACC_FIT[it.id];
    const p = br === 'base' ? ACC_POS[m.species]?.[formIdx(levelInfo(m).lv)] : ACC_ALT[m.species]?.[br];
    if (!p || !f) return `<span class="acc ${it.slot}" style="font-size:${accSize}px">${it.emoji}</span>`;
    const [ex, ey, ew, rot, hx, hy, hw] = p, k = size * 1.15 / 100, isFace = it.slot === 'face';
    const fs = (isFace ? ew : hw) * k * f.s;
    const x = isFace ? ex : hx + (f.dx || 0) * hw;
    const y = isFace ? ey + (f.dy || 0) * ew : hy - (f.up || 0) * fs / k;
    return `<span class="acc fit" style="font-size:${fs.toFixed(1)}px;left:${x.toFixed(1)}%;top:calc(${y.toFixed(1)}% - .5em)"><span style="display:inline-block;rotate:${(isFace ? rot : rot * .6).toFixed(0)}deg">${it.emoji}</span></span>`;
}

function monsterHTML(size = 120, interactive = true, m = activeMon()) {
    if (!m) return '';
    const head = SHOP.find(s => s.id === m.head);
    const face = SHOP.find(s => s.id === m.face);
    const accSize = Math.round(size * 0.42);
    return `<div class="text-center">
        <div class="monster-wrap" ${interactive ? 'onclick="pokeMonster(this)"' : ''} style="font-size:${size}px">
            <span class="monster" style="${emojiStyle(m)}">${formOf(m).e}</span>
            ${head ? accHTML(m, head, size, accSize) : ''}
            ${face ? accHTML(m, face, size, accSize) : ''}
            ${m.shiny ? `<span class="acc" style="top:-10%;left:85%;font-size:${Math.round(size * .25)}px">✨</span>` : ''}
        </div>
        <div class="shadow" style="width:${Math.round(size * .6)}px"></div>
    </div>`;
}

function monsterSay(m = activeMon()) {
    if (!m) return '';
    if (satiety(m) < 25) return pick(['肚子好餓…可以餵我吃東西嗎 🥺', '咕嚕咕嚕…好想吃蘋果…', '我餓到沒力氣冒險了…']);
    if (mood(m) < 30) return pick(['好無聊喔…陪我玩嘛 🎾', '摸摸我好不好…', '今天心情有點差…']);
    if (!S.lastActive || S.lastActive !== dateStr()) return pick(['今天還沒冒險喔！', '一起去抓今天的單字吧！']);
    if (hearts(m) >= 4 && Math.random() < .3) return pick(['最喜歡你了！💕', '我們是最強的搭檔！', '有你在我什麼單字都不怕']);
    const t = { glutton: '（盯著你的口袋看）有零食嗎？', lively: '快快快！我們去冒險！', smart: '我剛剛偷偷背了三個單字', clingy: '不要丟下我一個人喔…' }[m.trait];
    return Math.random() < .25 ? t : pick(speciesOf(m).say);
}

function pokeMonster(el) {
    if (Date.now() - (G.strokedAt || 0) < 400) return;   // 剛剛是滑動撫摸，不算點擊
    const b = $('mon-bubble');
    if (el.classList.contains('sleeping')) {
        G.wokeUntil = Date.now() + 90000;
        el.classList.remove('sleeping');
        el.parentElement.querySelectorAll('.zzz').forEach(z => z.remove());
        doAct(el, 'jump');
        playSound('pop');
        if (b) b.textContent = pick(['嗯…？你來啦！（揉眼睛）', '哈啊～被你吵醒了', '我、我沒有在睡覺喔！']);
        return;
    }
    doAct(el, pick(['jump', 'spin', 'wiggle']));
    playSound('pop');
    if (b) b.textContent = monsterSay();
}

// ---------- 小屋動畫 ----------
const ACTS = ['a-jump', 'a-spin', 'a-look', 'a-walk', 'a-wiggle', 'a-chomp'];
function doAct(el, act) {
    if (!el) return;
    ACTS.forEach(c => el.classList.remove(c));
    void el.offsetWidth;
    el.classList.add('a-' + act);
    clearTimeout(el._actT);
    el._actT = setTimeout(() => el.classList.remove('a-' + act), 3100);
}
function isNight() { const h = new Date().getHours(); return h >= 22 || h < 6; }
function isSleeping() { return isNight() && Date.now() > (G.wokeUntil || 0); }

function thought(emoji) {
    const st = $('mon-stage');
    if (!st || st.querySelector('.thought')) return;
    const t = document.createElement('span');
    t.className = 'thought';
    t.textContent = emoji;
    st.appendChild(t);
    setTimeout(() => t.remove(), 2700);
}

function idleTick() {
    if (G.tab !== 'home' || G.play || G.modalOpen || document.hidden) return;
    const w = document.querySelector('#mon-stage .monster-wrap');
    const m = activeMon();
    if (!w || !m) return;
    if (isSleeping()) { if (!w.classList.contains('sleeping')) renderHome(); return; }
    if (w.classList.contains('sleeping')) { renderHome(); return; }
    if (satiety(m) < 25 && Math.random() < .5) return thought(pick(['🍖', '🍎', '🍰']));
    if (mood(m) < 30 && Math.random() < .5) return thought(pick(['🎾', '😢', '💭']));
    const acts = mood(m) >= 70 ? ['jump', 'spin', 'walk', 'look', 'wiggle', 'jump'] : ['look', 'walk', 'wiggle'];
    doAct(w, pick(acts));
    if (Math.random() < .2) thought(pick(['💡', '🎵', '✨', '❓', '💕']));
}
setInterval(idleTick, 4500);

// 在怪獸身上來回滑動 = 撫摸
function bindStroke() {
    const st = $('mon-stage');
    if (!st) return;
    let last = null, dist = 0;
    st.onpointerdown = e => { last = [e.clientX, e.clientY]; dist = 0; };
    st.onpointermove = e => {
        if (!last) return;
        dist += Math.hypot(e.clientX - last[0], e.clientY - last[1]);
        last = [e.clientX, e.clientY];
        if (dist > 170) { dist = 0; G.strokedAt = Date.now(); petMon(); }
    };
    st.onpointerup = st.onpointercancel = st.onpointerleave = () => { last = null; };
}

function flyFood(emoji) {
    const st = $('mon-stage');
    if (!st) return;
    const f = document.createElement('span');
    f.className = 'food-fly';
    f.textContent = emoji;
    st.appendChild(f);
    setTimeout(() => {
        f.remove();
        doAct(st.querySelector('.monster-wrap'), 'chomp');
        playSound('tap'); setTimeout(() => playSound('tap'), 200);
        floatHearts('✨');
    }, 650);
}

function floatHearts(emoji = '💗') {
    const box = $('mon-stage');
    if (!box) return;
    for (let i = 0; i < 4; i++) {
        const h = document.createElement('span');
        h.textContent = emoji;
        h.className = 'float-heart';
        h.style.left = `${35 + Math.random() * 30}%`;
        h.style.animationDelay = `${i * .12}s`;
        box.appendChild(h);
        setTimeout(() => h.remove(), 1400);
    }
}

function petMon() {
    const m = activeMon();
    if (!m) return;
    if (m.petDay !== dateStr()) { m.petDay = dateStr(); m.pets = 0; }
    const wrap = document.querySelector('#mon-stage .monster-wrap');
    if (wrap?.classList.contains('sleeping')) { pokeMonster(wrap); return; }
    doAct(wrap, 'wiggle');
    if (m.pets < 5) {
        m.pets++; bumpStat('pets');
        cheer(10);
        addAffection(m.trait === 'clingy' ? 2 : 1);
        floatHearts('💗');
        playSound('pop');
        $('mon-bubble').textContent = pick(['嘿嘿～好舒服', '再摸一下嘛！', '最喜歡你了～', '（開心地轉圈圈）']);
    } else {
        cheer(2);
        $('mon-bubble').textContent = '今天摸夠了啦～一起玩遊戲好不好？';
    }
    save(); renderHomeStats();
    runModalQueue();
}

function feedItem(id) {
    const m = activeMon();
    const f = FOODS.find(x => x.id === id);
    if (!m || !f) return;
    if ((S.foods[id] || 0) <= 0) { playSound('wrong'); return toast(f.price ? `沒有${f.name}了，可以去商店買` : '沒有蘋果了，去冒險抓單字就能拿到', 'bad'); }
    if (satiety(m) >= 100 && f.food >= 10) return toast(`${m.name} 已經吃不下了～`);
    S.foods[id]--; bumpStat('feeds');
    const k = m.trait === 'glutton' ? 1.5 : 1;
    feed(Math.round(f.food * k));
    cheer(Math.round(f.mood * k));
    addAffection(1);
    playSound('coin');
    save();
    closeModal();
    renderHome();
    setTimeout(() => {
        flyFood(f.e);
        const b = $('mon-bubble');
        if (b) b.textContent = pick([`${f.name}好好吃！`, '嗯嗯～還要！', '吃飽飽才有力氣冒險', 'Yummy! 😋']);
    }, 50);
    runModalQueue();
}

// ---------- 蛋 ----------
function randomEggSpecies() {
    const owned = new Set(S.mons.map(m => m.species).concat(S.eggs.map(e => e.species)));
    if (!owned.has('ghost') && Math.random() < 0.12) return 'ghost';
    const fresh = SPECIES.filter(s => !s.rare && !owned.has(s.id));
    return pick(fresh.length ? fresh : SPECIES.filter(s => !s.rare)).id;
}
function addEgg(species = randomEggSpecies()) {
    if (S.eggs.length >= MAX_EGGS) return false;
    S.eggs.push({ id: Math.random().toString(36).slice(2, 9), species, progress: 0, need: EGG_NEED });
    return true;
}
function progressEggs(n = 1) {
    let ready = false;
    S.eggs.forEach(e => { const was = e.progress >= e.need; e.progress = Math.min(e.need, e.progress + n); if (!was && e.progress >= e.need) ready = true; });
    if (ready) toast('🥚 有蛋可以孵化了！回小屋看看', 'gold', 3000);
}
function hatchEgg(id) {
    const i = S.eggs.findIndex(e => e.id === id);
    const egg = S.eggs[i];
    if (!egg) return;
    if (egg.progress < egg.need) return toast(`還要再答對 ${egg.need - egg.progress} 題才能孵化`);
    const sp = SPECIES.find(s => s.id === egg.species);
    G.hatchTaps = 0;
    G.hatchGo = () => revealHatch();
    showModal(`<div class="card p-7 modal text-center">
        <div class="text-sm font-black" style="color:var(--orange-d)">蛋在晃動…</div>
        <button id="hatch-egg" class="relative text-8xl my-6 border-0 bg-transparent p-0 wiggle" style="animation-iteration-count:infinite;${eggStyle(sp)}" onclick="crackEgg()">🥚<span id="crack" class="crack"></span></button>
        <div id="hatch-tip" class="text-xl font-black">點蛋 3 下幫牠破殼！</div>
    </div>`, { dismissable: false });
    playSound('pop');

    function revealHatch() {
        S.eggs.splice(i, 1);
        const m = newMon(egg.species);
        S.mons.push(m); bumpStat('hatched');
        const isNew = !S.seen.includes(sp.id);
        if (isNew) S.seen.push(sp.id);
        save();
        playSound('levelup'); burst();
        showModal(`<div class="card p-7 modal text-center">
            <div class="text-sm font-black" style="color:${sp.color}">${isNew ? '🎉 發現新種族！' : '孵化成功！'}${m.shiny ? ' ✨ 閃光色！' : ''}</div>
            <div class="py-5 my-3" style="background:${sp.tint};border-radius:20px">${monsterHTML(100, false, m)}</div>
            <div class="text-2xl font-black">${formOf(m).n}</div>

// ============================================================
// Claude API
// ============================================================
class ClaudeError extends Error { constructor(msg, status, retryable = false) { super(msg); this.status = status; this.retryable = retryable; } }

function friendlyError(status, msg) {
    if (status === 401) return 'API Key 無效，請到「我的」重新設定。';
    if (status === 403) return `這把 Key 沒有權限使用 ${model}。`;
    if (status === 404) return `找不到模型 ${model}，請到「我的」換一個。`;
    if (status === 429) return '請求太頻繁或額度用完了，稍等一下再試。';
    if (status === 529) return 'Claude 現在很忙，稍等一下再試。';
    if (status >= 500) return `Claude 服務暫時異常（${status}）。`;
    if (status === 400) return `請求格式錯誤：${msg || '未知原因'}`;
    return msg || `API 錯誤（${status}）`;
}

async function claudeRequest(body, useFallback = true) {
    const headers = {
        'content-type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2026-10-21',
        // 瀏覽器直接呼叫 Claude API 需要此標頭；Key 只存在本機，僅適合個人使用
        'anthropic-dangerous-direct-browser-access': 'true'
    };
    const payload = { ...body };
    if (useFallback && MODELS_WITH_FALLBACK.includes(payload.model)) {
        headers['anthropic-beta'] = 'server-side-fallback-2026-07-01';
        payload.fallbacks = 'default';
    }
    let res;
    try { res = await fetch(CLAUDE_API_URL, { method: 'POST', headers, body: JSON.stringify(payload) }); }
    catch { throw new ClaudeError('連不上 Claude API，請檢查網路。', 0, true); }
    if (!res.ok) {
        let msg = '';
        try { msg = (await res.json())?.error?.message || ''; } catch {}
        if (res.status === 400 && payload.fallbacks && /fallback/i.test(msg)) return claudeRequest(body, false);
        throw new ClaudeError(friendlyError(res.status, msg), res.status, res.status === 429 || res.status === 529 || res.status >= 500);
    }
    return res.json();
}

async function callClaude({ system, messages, maxTokens = 16000 }) {
    const body = { model, max_tokens: maxTokens, system, messages, output_config: { effort: 'low' } };
    let last;
    for (let i = 0; i < 3; i++) {
        try {
            const data = await claudeRequest(body);
            if (data.stop_reason === 'refusal') throw new ClaudeError('Claude 無法回應這個請求，換個說法試試。', 200);
            const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('').trim();
            if (!text) throw new ClaudeError('Claude 沒有回傳內容，再試一次。', 200, true);
            return { text, content: data.content };
        } catch (e) {
            last = e;
            if (!(e instanceof ClaudeError) || !e.retryable || i === 2) break;
            await sleep(800 * 2 ** i + Math.random() * 300);
        }
    }
    throw last;
}

function parseJSON(text) {
    let t = text.replace(/```(?:json)?/gi, '').trim();
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a !== -1 && b > a) t = t.slice(a, b + 1);
    return JSON.parse(t);
}

async function callClaudeJSON(system, prompt) {
    for (let i = 0; i < 2; i++) {
        const { text } = await callClaude({ system, messages: [{ role: 'user', content: prompt }] });
        try { return parseJSON(text); } catch { if (i === 1) throw new ClaudeError('AI 回傳的格式看不懂，再試一次。', 200); }
    }
}

const JSON_SYSTEM = `You are the content engine of a vocabulary game for Traditional Chinese (Taiwan) speakers learning English.
All Chinese must be natural Traditional Chinese as used in Taiwan (繁體中文), never Simplified Chinese.
Reply with one valid JSON object only — no markdown fences, no extra text.`;

(variation #${Math.floor(Math.random() * 1e6)})

- "distractors": 3 plausible but WRONG Traditional Chinese meanings, all different from "mean".

JSON shape:

// ============================================================
// 單字取得（含預先載入）
// ============================================================
function knownWords() { return [...new Set([...Object.values(S.dex).map(d => d.word), ...S.legacy, ...(G.skipWords || [])])]; }

function cleanWords(words, needParts = false) {
    if (!Array.isArray(words)) return [];
    const seen = new Set(Object.keys(S.dex));
    return words.filter(w => {
        if (!w || typeof w.word !== 'string' || !w.word.trim() || !w.mean) return false;
        w.word = w.word.trim();
        const k = w.word.toLowerCase();
        if (seen.has(k) || !norm(w.word)) return false;
        seen.add(k);
        w.rarity = [1, 2, 3].includes(Number(w.rarity)) ? Number(w.rarity) : 1;
        w.distractors = Array.isArray(w.distractors) ? w.distractors.filter(d => d && d !== w.mean) : [];
        // 複合字：兩個部分拼起來必須等於原字，否則丟掉 parts
        const okParts = Array.isArray(w.parts) && w.parts.length === 2 && w.parts.every(p => typeof p === 'string' && norm(p)) && norm(w.parts.join('')) === norm(w.word);
        if (okParts) { w.parts = w.parts.map(p => p.trim()); w.partMeans = Array.isArray(w.partMeans) ? w.partMeans.slice(0, 2).map(String) : ['', '']; }
        else { delete w.parts; delete w.partMeans; }
        return needParts ? okParts : true;
    });
}

function fetchStageWords(regionId) {
    const key = `${regionId}|${S.level}|${model}`;
    if (!G.prefetch[key]) {
        const isWorkshop = regionId === WORKSHOP.id;
        const region = regionMeta(regionId);
        G.prefetch[key] = callClaudeJSON(JSON_SYSTEM, isWorkshop ? compoundPrompt(knownWords()) : vocabPrompt(region, knownWords()))
            .then(d => { const w = cleanWords(d.words, isWorkshop); if (w.length < 3) throw new ClaudeError('AI 給的單字不夠，再試一次。', 200); return w; })
            .catch(e => { delete G.prefetch[key]; throw e; });
        G.prefetch[key].catch(() => {});
    }
    return G.prefetch[key];
}
function takeStageWords(regionId) {
    const key = `${regionId}|${S.level}|${model}`;
    const p = fetchStageWords(regionId);
    delete G.prefetch[key];
    return p;
}

// ============================================================
// 進度
// ============================================================
function prog(id) { return S.progress[id] || (S.progress[id] = { stars: Array(STAGES_PER_REGION).fill(0), boss: false }); }
function regionUnlocked(i) { return i === 0 || !!S.progress[REGIONS[i - 1].id]?.boss; }
function stageUnlocked(r, idx) { const p = prog(r.id); return idx === 0 || p.stars[idx - 1] > 0; }
function bossUnlocked(r) { return prog(r.id).stars[STAGES_PER_REGION - 1] > 0; }
function currentRegionIndex() { let i = 0; while (i + 1 < REGIONS.length && regionUnlocked(i + 1)) i++; return i; }
function regionWords(id) { return Object.values(S.dex).filter(d => d.region === id); }
// ---------- 間隔複習（Leitner 盒子）----------
const DAY = 86400000;
const SRS_DAYS = [0, 1, 3, 7, 14, 30];   // 第 n 盒答對後隔幾天再出現
function srsInit(d) { if (d.box == null) { d.box = 1; d.due = (d.caught || Date.now()) + DAY; } return d; }
function srsHit(d, ok) {
    if (!d) return;
    srsInit(d);
    const now = Date.now();
    if (ok) {
        if (d.due <= now) { d.box = Math.min(5, d.box + 1); d.due = now + SRS_DAYS[d.box] * DAY; }
        if (d.lastWrong && d.box >= 3 && !d.fixed) { d.fixed = true; S.stats.fixed = (S.stats.fixed || 0) + 1; }
    } else {
        d.box = 1; d.due = now; d.lastWrong = now; d.fixed = false;
    }
}
function dueWords() { const now = Date.now(); return Object.values(S.dex).map(srsInit).filter(d => d.due <= now); }
function wrongWords() { return Object.values(S.dex).filter(d => d.lastWrong && !d.fixed).sort((a, b) => b.lastWrong - a.lastWrong); }
function mastery(d) { srsInit(d); return Math.max(0, Math.min(3, d.box - 1)); }

            <div class="text-4xl">📚</div>
            <div class="flex-1 min-w-0">
                <div class="font-black">${due ? `今天有 ${due} 個單字該複習了` : '錯題本還有單字沒練熟'}</div>
                <div class="text-xs mt-0.5" style="color:var(--muted)">依遺忘曲線安排 1・3・7・14・30 天後再複習${wrong ? `・❌ 錯題 ${wrong} 個` : ''}</div>
            </div>
            <div class="flex flex-col gap-1.5">
                ${due ? `<button class="btn sm purple" onclick="startReview('due')">開始複習</button>` : ''}
                ${wrong ? `<button class="btn sm white" onclick="startReview('wrong')">練錯題</button>` : ''}
            </div>
        </div>`;
    })()}

    <div class="grid grid-cols-4 gap-2 mt-4">
        <button class="card p-2.5 text-center" onclick="switchTab('dex')"><div class="text-2xl">📖</div><div class="text-sm font-black">${caught}</div><div class="text-[11px]" style="color:var(--muted)">圖鑑</div></button>
        <button class="card p-2.5 text-center" onclick="startReview()"><div class="text-2xl">💪</div><div class="text-sm font-black">訓練</div><div class="text-[11px]" style="color:var(--muted)">不花錢</div></button>
        <button class="card p-2.5 text-center" onclick="openArena()"><div class="text-2xl">⚔️</div><div class="text-sm font-black">競技場</div><div class="text-[11px]" style="color:var(--muted)">🏆 ${S.arena.trophies}</div></button>
        <button class="card p-2.5 text-center" onclick="openShop()"><div class="text-2xl">🛍️</div><div class="text-sm font-black">商店</div><div class="text-[11px]" style="color:var(--muted)">🪙 ${S.coins}</div></button>
    </div>

    <div class="card p-4 mt-4">
        <div class="flex items-center justify-between mb-3"><h3 class="font-black text-lg">📅 每日任務</h3><span class="text-xs" style="color:var(--muted)">每天 0 點重置</span></div>
        <div class="space-y-3">${QUESTS.map(q => {
            const v = Math.min(S.daily[q.id] || 0, q.target);
            const done = v >= q.target, claimed = S.daily.claimed.includes(q.id);
            return `<div class="flex items-center gap-3">
                <div class="text-2xl w-9 text-center">${q.icon}</div>
                <div class="flex-1 min-w-0">
                    <div class="text-sm font-black">${q.text}</div>
                    <div class="flex items-center gap-2 mt-1"><div class="bar flex-1" style="height:10px"><i style="width:${v / q.target * 100}%;background:var(--purple)"></i></div><span class="text-xs" style="color:var(--muted)">${v}/${q.target}</span></div>
                </div>
                ${claimed ? '<span class="text-sm" style="color:var(--muted)">已領取 ✓</span>'
                    : `<button class="btn sm ${done ? 'orange' : ''}" ${done ? '' : 'disabled'} onclick="claimQuest('${q.id}')">🪙 ${q.reward}</button>`}
            </div>`; }).join('')}
        </div>
    </div>`;
    renderHomeStats();
    bindStroke();
}

function claimQuest(id) {
    const q = QUESTS.find(x => x.id === id);
    if (!q || S.daily.claimed.includes(id) || (S.daily[id] || 0) < q.target) return;
    S.daily.claimed.push(id);
    S.coins += q.reward;
    playSound('coin');
    burst();
    save(); renderHome();
}

function goAdventure() {
    if (!apiKey) return openKeyModal(true);
    G.mapRegion = REGIONS[currentRegionIndex()].id;
    switchTab('map');
}

// ---------- 冒險地圖 ----------
function renderMap() {
    if (!G.mapRegion) G.mapRegion = REGIONS[currentRegionIndex()].id;
    const ri = REGIONS.findIndex(r => r.id === G.mapRegion);
    const r = REGIONS[ri];
    const p = prog(r.id);
    const offsets = [0, 70, 95, 55, -20, 0];
    let currentIdx = p.stars.findIndex(s => s === 0);
    if (currentIdx === -1) currentIdx = p.boss ? -1 : STAGES_PER_REGION;
    const totalStars = p.stars.reduce((a, b) => a + b, 0);

    const nodes = Array.from({ length: STAGES_PER_REGION }, (_, i) => {
        const unlocked = stageUnlocked(r, i);
        const stars = p.stars[i];
        const isCur = i === currentIdx;
        return `<div class="flex justify-center" style="transform:translateX(${offsets[i] - 35}px);margin-bottom:46px">
            <button class="node ${unlocked ? '' : 'locked'} ${isCur ? 'current' : ''}" style="${unlocked ? `--nc:${r.c};--ncd:${r.cd}` : ''}"
                onclick="${unlocked ? `startStage('${r.id}', ${i})` : `toast('先完成上一關才能解鎖 🔒')`}" aria-label="第 ${i + 1} 關">
                ${isCur ? '<span class="start-tag">開始！</span>' : ''}
                ${unlocked ? (stars ? '✓' : ['🌱', '🍃', '🌿', '🌳', '🔥'][i]) : '🔒'}
                ${stars ? `<span class="node-stars">${'⭐'.repeat(stars)}${'<span style="filter:grayscale(1);opacity:.3">⭐</span>'.repeat(3 - stars)}</span>` : ''}
            </button>
        </div>`;
    }).join('');

    const bossOpen = bossUnlocked(r);
    const bossNode = `<div class="flex justify-center" style="transform:translateX(-35px)">
        <button class="node boss ${bossOpen ? '' : 'locked'} ${currentIdx === STAGES_PER_REGION ? 'current' : ''}" style="${bossOpen ? `--nc:${p.boss ? r.c : '#4b5563'};--ncd:${p.boss ? r.cd : '#1f2937'}` : ''}"
            onclick="${bossOpen ? `startBoss('${r.id}')` : `toast('打完前 5 關才能挑戰魔王 👀')`}" aria-label="魔王關">
            ${currentIdx === STAGES_PER_REGION ? '<span class="start-tag" style="color:#ef4444">魔王！</span>' : ''}
            ${bossOpen ? r.boss : '🔒'}
            ${p.boss ? '<span class="node-stars">👑 已擊敗</span>' : ''}
        </button>
    </div>`;

    $('tab-map').innerHTML = `
    <div class="flex gap-2 overflow-x-auto noscroll -mx-4 px-4 pb-3 pt-1">
        ${REGIONS.map((x, i) => `<button class="chip ${x.id === r.id ? 'active' : ''} ${regionUnlocked(i) ? '' : 'locked'}" onclick="selectRegion('${x.id}', ${i})">${regionUnlocked(i) ? x.emoji : '🔒'} ${x.name}</button>`).join('')}
    </div>
    <div class="card p-4 anim-in" style="background:${r.t};border-color:${r.c}55">
        <div class="flex items-center gap-3">
            <div class="text-4xl">${r.emoji}</div>
            <div class="flex-1"><div class="text-xs font-black" style="color:${r.cd}">第 ${ri + 1} 區</div><div class="text-xl font-black">${r.name}</div><div class="text-xs" style="color:var(--muted)">${r.topic} · ${LEVELS[S.level].label}</div></div>
            <div class="text-right"><div class="font-black">⭐ ${totalStars}/${STAGES_PER_REGION * 3}</div><div class="text-xs" style="color:var(--muted)">📖 ${regionWords(r.id).length} 個</div></div>
        </div>
    </div>
    <div class="relative pt-12 pb-6 mt-3 overflow-hidden trail" style="--rt:${r.t}">${nodes}${bossNode}</div>
    ${p.boss && ri + 1 < REGIONS.length ? `<button class="btn w-full mb-3" style="--c:${REGIONS[ri + 1].c};--cd:${REGIONS[ri + 1].cd}" onclick="selectRegion('${REGIONS[ri + 1].id}', ${ri + 1})">前往下一區：${REGIONS[ri + 1].emoji} ${REGIONS[ri + 1].name} →</button>` : ''}
    <button class="card p-4 mt-2 w-full text-left flex items-center gap-3" style="background:${WORKSHOP.t};border-color:${WORKSHOP.c}44" onclick="startWorkshop()">
        <div class="text-4xl">🧩</div>
        <div class="flex-1"><div class="font-black text-lg">複合字工坊</div><div class="text-xs" style="color:var(--muted)">把兩個單字拼成一個新字（tooth + brush = toothbrush）・已收集 ${regionWords(WORKSHOP.id).length} 個</div></div>
        <span class="btn sm purple">開工</span>
    </button>
    <div class="card p-4 mt-3">
        <div class="flex items-center gap-3 mb-3"><div class="text-3xl">🏯</div><div><div class="font-black text-lg">文法道館</div><div class="text-xs" style="color:var(--muted)">每次 5 題，答對拿金幣</div></div></div>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">${GRAMMAR_TOPICS.map((g, i) => `<button class="btn white sm" onclick="startGrammar(${i})">${g.e} ${g.label}</button>`).join('')}</div>
    </div>`;

    // 先在背景準備下一關的單字，按下去就能直接開始
    if (apiKey && currentIdx >= 0 && currentIdx < STAGES_PER_REGION) fetchStageWords(r.id);
}

function selectRegion(id, i) {
    if (!regionUnlocked(i)) return toast(`先打敗 ${REGIONS[i - 1].name} 的魔王 ${REGIONS[i - 1].boss} 才能前往`);
    G.mapRegion = id;
    renderMap();
}

// ---------- 圖鑑 ----------
function renderDex() {
    const all = Object.values(S.dex);
    const toggle = `<div class="grid grid-cols-2 gap-1 p-1 rounded-2xl mb-3" style="background:#e3ebdf">
        ${[['words', '📖 單字圖鑑'], ['mons', '🐾 怪獸圖鑑']].map(([k, l]) => `<button class="py-2 rounded-xl font-black text-sm border-0" style="${G.dexMode === k ? 'background:#fff;box-shadow:0 2px 0 var(--line)' : 'background:transparent;color:var(--muted)'}" onclick="G.dexMode='${k}'; renderDex()">${l}</button>`).join('')}</div>`;
    if (G.dexMode === 'mons') {
        const best = {};
        S.mons.forEach(x => { best[x.species] = Math.max(best[x.species] ?? -1, formIdx(levelInfo(x).lv)); });
        S.mons.forEach(markForm);
        const alts = s => ['base', 'guard', 'battle'].filter(b => S.forms[`${s.id}_${b}`]);
        const found = SPECIES.reduce((a, s) => a + Math.min(best[s.id] ?? -1, 1) + 1 + alts(s).length, 0);
        $('tab-dex').innerHTML = `<div class="mt-1">${toggle}</div>
        <div class="card p-4 mb-3 flex items-center justify-between"><div><div class="font-black">已發現型態</div><div class="text-xs" style="color:var(--muted)">把每族都養到最終型態吧！</div></div><div class="text-2xl font-black">${found}<span class="text-sm" style="color:var(--muted)">/${SPECIES.length * 5}</span></div></div>
        <div class="space-y-3">${SPECIES.map(s => {
            const b = best[s.id] ?? -1;
            const cells = [...s.forms.map((f, i) => [f, i < 2 ? i <= b : alts(s).includes('base'), `Lv.${FORM_LV[i]}`]), ...['guard', 'battle'].map(k => [s.alt[k], alts(s).includes(k), branchMeta(k).icon + branchMeta(k).name])];
            return `<div class="card p-3" style="${b >= 0 ? `background:${s.tint}` : ''}">
                <div class="flex items-baseline gap-2 mb-2"><div class="font-black text-sm">${b >= 0 ? s.name : '???'}</div><div class="text-xs" style="color:${b >= 0 ? s.color : 'var(--muted)'}">${b >= 0 ? s.type : (s.rare ? '稀有種族' : '尚未發現')}</div></div>
                <div class="grid grid-cols-5 gap-1 text-center">${cells.map(([f, ok, hint]) => `<div><div class="text-3xl" style="${ok ? '' : 'filter:brightness(0);opacity:.15'}">${f.e}</div><div class="text-[10px]" style="color:var(--muted)">${ok ? f.n : hint}</div></div>`).join('')}</div>
            </div>`; }).join('')}</div>`;
        return;
    }
    $('tab-dex').innerHTML = `<div class="mt-1">${toggle}</div>
    <div class="flex items-center justify-between mb-3">
        <h2 class="text-xl font-black">已收集 ${all.length} 個單字</h2>
        <button class="btn sm purple" onclick="startReview()">💪 訓練場</button>
    </div>
    <input class="field mb-3" placeholder="搜尋英文或中文…" value="${esc(G.dexQuery)}" oninput="G.dexQuery=this.value; renderDexList()">
    <div class="flex gap-2 overflow-x-auto noscroll -mx-4 px-4 pb-3">
        <button class="chip ${G.dexRegion === 'all' ? 'active' : ''}" onclick="G.dexRegion='all'; renderDex()">全部 ${all.length}</button>
        ${wrongWords().length ? `<button class="chip ${G.dexRegion === 'wrong' ? 'active' : ''}" style="${G.dexRegion === 'wrong' ? '' : 'color:var(--red-d);border-color:#f5c2c2'}" onclick="G.dexRegion='wrong'; renderDex()">❌ 錯題本 ${wrongWords().length}</button>` : ''}
        ${dueWords().length ? `<button class="chip ${G.dexRegion === 'due' ? 'active' : ''}" onclick="G.dexRegion='due'; renderDex()">⏰ 待複習 ${dueWords().length}</button>` : ''}
        ${[...REGIONS, WORKSHOP].filter(r => regionWords(r.id).length).map(r => `<button class="chip ${G.dexRegion === r.id ? 'active' : ''}" onclick="G.dexRegion='${r.id}'; renderDex()">${r.emoji} ${regionWords(r.id).length}</button>`).join('')}
    </div>
    <div id="dex-list"></div>`;
    renderDexList();
}

function renderDexList() {
    const all = Object.values(S.dex);
    let list = G.dexRegion === 'all' ? all : G.dexRegion === 'wrong' ? wrongWords() : G.dexRegion === 'due' ? dueWords() : all.filter(d => d.region === G.dexRegion);
    const q = G.dexQuery.trim().toLowerCase();
    if (q) list = list.filter(d => d.word.toLowerCase().includes(q) || String(d.mean).includes(q));
    if (G.dexRegion !== 'wrong') list.sort((a, b) => b.caught - a.caught);
    const rc = ['', '#9aa595', '#3b9ae1', '#a855f7'];
    const el = $('dex-list');
    if (!el) return;
    const head = G.dexRegion === 'wrong' && list.length ? `<div class="card p-3 mb-3 flex items-center gap-3" style="background:var(--red-t);border-color:#f5c2c2"><div class="flex-1 text-sm"><b>❌ 錯題本</b><div class="text-xs" style="color:var(--muted)">答錯過的單字會留在這裡，複習答對到熟練度 2 格就會畢業</div></div><button class="btn sm red" onclick="startReview('wrong')">練錯題</button></div>`
        : G.dexRegion === 'due' && list.length ? `<div class="card p-3 mb-3 flex items-center gap-3" style="background:var(--purple-t);border-color:#d6ccfa"><div class="flex-1 text-sm"><b>⏰ 今天該複習</b><div class="text-xs" style="color:var(--muted)">依遺忘曲線排程，準時複習記得最牢</div></div><button class="btn sm purple" onclick="startReview('due')">開始複習</button></div>` : '';
    if (!all.length) {
        el.innerHTML = `<div class="card p-8 text-center"><div class="text-5xl mb-2">🕸️</div><div class="font-black text-lg">圖鑑還是空的</div><p class="text-sm mt-1 mb-4" style="color:var(--muted)">到冒險地圖抓到的單字都會收進這裡</p><button class="btn" onclick="goAdventure()">去抓第一個單字</button></div>`;
        return;
    }
    if (!list.length) { el.innerHTML = '<p class="text-center py-8" style="color:var(--muted)">找不到符合的單字</p>'; return; }
    el.innerHTML = head + `<div class="grid grid-cols-2 gap-3">${list.map(d => {
        const r = regionMeta(d.region);
        const m = mastery(d);
        const dueIn = Math.ceil((d.due - Date.now()) / DAY);
        return `<button class="card p-3 text-left relative" style="border-color:${rc[d.rarity]}55" onclick="openWord('${esc(d.word.toLowerCase())}')">
            <div class="flex items-center justify-between text-xs"><span>${r.emoji}${d.lastWrong && !d.fixed ? ' <span style="color:var(--red-d)">❌</span>' : ''}</span><span style="color:${dueIn <= 0 ? 'var(--purple-d)' : 'var(--muted)'}">${dueIn <= 0 ? '⏰ 該複習' : `${dueIn} 天後`}</span></div>
            <div class="text-lg font-black mt-1 break-words">${esc(d.word)}</div>
            <div class="text-sm truncate" style="color:var(--muted)">${esc(d.mean)}</div>
            <div class="flex gap-1 mt-2">${[0, 1, 2].map(i => `<span class="h-1.5 flex-1 rounded-full" style="background:${i < m ? 'var(--green)' : '#e3ebdf'}"></span>`).join('')}</div>
        </button>`; }).join('')}</div>`;
}

function openWord(key) {
    const d = S.dex[key];
    if (!d) return;
    const r = regionMeta(d.region);
    showModal(`<div class="card p-6 modal text-center">
        <div class="text-xs font-black mb-1" style="color:${r.cd}">${r.emoji} ${r.name} · ${'★'.repeat(d.rarity)}</div>
        <div class="text-4xl font-black break-words">${esc(d.word)}</div>
        <div class="mt-1" style="color:var(--muted)">${esc(d.pos || '')} ${esc(d.ipa || '')}</div>
        <div class="flex justify-center gap-2 my-4">
            <button class="btn blue sm" onclick="speak(${JSON.stringify(d.word).replace(/"/g, '&quot;')})">🔊 發音</button>
            <button class="btn white sm" onclick="speak(${JSON.stringify(d.word).replace(/"/g, '&quot;')}, .5)">🐢 慢速</button>
        </div>
        <div class="text-2xl font-black" style="color:var(--green-d)">${esc(d.mean)}</div>

    speak(d.word);
}

function exportData() {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `linguamon-${dateStr()}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function importData(input) {
    const file = input.files?.[0];
    if (!file) return;
    file.text().then(t => {
        const d = migrate(safeParse(t));
        if (!d || typeof d.dex !== 'object' || !Array.isArray(d.mons)) return toast('這不是有效的存檔檔案', 'bad');
        if (!confirm('匯入會覆蓋目前的進度，確定嗎？')) return;
        Object.keys(S).forEach(k => delete S[k]);
        Object.assign(S, d);
        save(); render(); toast('存檔已匯入', 'good');
    }).finally(() => { input.value = ''; });
}

function resetAll() {
    if (!confirm('確定要重置全部進度嗎？\n怪獸、圖鑑、金幣和地圖進度都會清空，無法復原！')) return;
    Object.keys(S).forEach(k => delete S[k]);
    Object.assign(S, defaultState());
    S.legacy = [];
    G.prefetch = {}; G.mapRegion = null;
    save(); switchTab('home'); starterModal();
}

// ---------- 題目產生 ----------
function blankSentence(w) {
    if (!w.example) return null;
    const re = new RegExp(`\\b${w.word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i');
    return re.test(w.example) ? w.example.replace(re, '_____') : null;
}

function makeChallenge(type, w, pool) {
    const others = pool.filter(x => x.word !== w.word);
    const four = (correct, list) => shuffle([correct, ...shuffle([...new Set(list)].filter(x => x && x !== correct)).slice(0, 3)]);
    switch (type) {
        case 'meaning': return { type, w, label: '這個單字是什麼意思？', options: four(w.mean, [...shuffle(w.distractors || []), ...others.map(o => o.mean), '天氣', '鄰居', '帳單']), answer: w.mean, autoSpeak: true };
        case 'listen': return { type, w, label: '聽聽看，是哪一個單字？', options: four(w.word, [...others.map(o => o.word), 'window', 'garden', 'travel']), answer: w.word, autoSpeak: true };
        case 'reverse': return { type, w, label: '這個英文怎麼說？', options: four(w.word, [...others.map(o => o.word), 'window', 'garden', 'travel']), answer: w.word };
        case 'fill': {
            const s = blankSentence(w);
            if (!s) return makeChallenge('reverse', w, pool);
            return { type, w, label: '選出適合填入空格的單字', sentence: s, options: four(w.word, [...others.map(o => o.word), 'window', 'garden']), answer: w.word };
        }
        case 'spell': {
            const letters = [...w.word.toLowerCase()].filter(c => /[a-z]/.test(c));
            if (letters.length > 14) return makeChallenge('reverse', w, pool);
            const decoys = shuffle('aeioustrnlm'.split('')).slice(0, letters.length > 9 ? 1 : 2);
            return { type, w, label: '拼出這個單字', tiles: shuffle([...letters, ...decoys]).map((ch, i) => ({ ch, i })), picked: [], answer: w.word };
        }
        case 'combine': {
            if (!w.parts) return makeChallenge('spell', w, pool);
            const fake = shuffle([...new Set(others.flatMap(o => o.parts || []).concat(['day', 'light', 'book', 'water', 'man', 'side', 'house', 'ball']))]
                .filter(p => !w.parts.map(x => x.toLowerCase()).includes(p.toLowerCase()))).slice(0, 3);
            return { type, w, label: '把兩個單字組合起來', pieces: shuffle([...w.parts, ...fake]), picked: [], answer: w.word };
        }
    }
}

function stageChallenges(words, workshop = false) {
    const first = shuffle(words).map(w => makeChallenge(pick(['meaning', 'listen']), w, words));
    const second = shuffle(words).map(w => makeChallenge(workshop ? 'combine' : w.parts ? pick(['combine', 'spell', 'fill']) : pick(['reverse', 'spell', 'fill', 'spell']), w, words));
    return [...first, ...second];
}

function mixedChallenges(words, n) {
    return shuffle(words).slice(0, n).map(w => makeChallenge(pick(['meaning', 'listen', 'reverse', 'spell', 'fill']), w, words));
}

    const workshop = regionId === WORKSHOP.id;

function startReview(mode = 'auto') {
    closeModal();

    let pickList;
    if (mode === 'wrong') {
        pickList = wrongWords();
        if (!pickList.length) return toast('錯題本是空的，太厲害了！', 'good');
    } else {
        // 先排到期的單字，再補熟練度低、很久沒看的
        const due = dueWords().sort((a, b) => a.due - b.due);
        const rest = words.filter(w => !due.includes(w)).sort((a, b) => (mastery(a) - mastery(b)) || ((a.seen || 0) - (b.seen || 0)));
        pickList = [...due, ...rest];
    }
    const n = Math.min(10, pickList.length);
    const chosen = pickList.slice(0, n);
    const queue = chosen.map(w => makeChallenge(pick(['meaning', 'listen', 'reverse', 'spell', 'fill']), w, words));
    G.play = { kind: 'review', mode, words, phase: 'quiz', queue, qi: 0, hearts: Infinity, mistakes: 0, combo: 0, maxCombo: 0, done: 0, total: n };
    openPlay();
    renderChallenge();
}

function startGame(id) {
    if (id === 'quiz') return startFun();
    ({ catch: startCatch, bubble: startBubble, memory: startMemory })[id]();
}

function gamePool(n) {
    let w = Object.values(S.dex).filter(d => d.mean);
    if (w.length < n) w = [...w, ...BASIC_WORDS.filter(b => !w.some(x => x.word === b.word))];
    // 同一局內中文意思不可重複，否則會無法判斷
    const seen = new Set();
    return shuffle(w).filter(x => !seen.has(x.mean) && seen.add(x.mean)).slice(0, n);
}

function stopGame() {
    const g = G.game;
    if (!g) return;
    g.over = true;
    cancelAnimationFrame(g.raf);
    clearInterval(g.tick);
    if (g.onKey) { document.removeEventListener('keydown', g.onKey); document.removeEventListener('keyup', g.onKey); }
    G.game = null;
}

function scorePop(arena, x, y, text, color) {

}

function finishGame(id, score, note = '') {
    const g = GAMES.find(x => x.id === id);

    progressEggs(Math.min(5, Math.floor(score / 25)));

    $('play-head').innerHTML = '';
    $('play-body').innerHTML = `<div class="text-center pt-6 anim-in">
