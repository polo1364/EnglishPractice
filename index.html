function startCatch() {
    gameIntro('catch', '畫面上方會顯示一個<b>中文意思</b>，英文單字會從天上掉下來。<br>👉 拖曳畫面或按 <b>← →</b> 移動怪獸，接住<b>正確</b>的單字！<br>❌ 接到錯的會扣一顆心，3 顆心用完或 45 秒到就結束。', () => {
        const m = activeMon();
        const g = G.game = { id: 'catch', words: gamePool(10), score: 0, hearts: 3, combo: 0, x: 50, items: [], t0: performance.now(), dur: 45000, lastSpawn: 0, keys: {}, dir: 1 };
        gameHead(`<span class="pill" style="background:var(--red-t);color:var(--red-d)" id="g-hearts">❤️❤️❤️</span>`);
        $('play-body').innerHTML = `<div class="text-center font-black my-2 text-lg">接住「<span id="g-target" style="color:var(--green-d)"></span>」</div>
            <div id="arena" class="arena" style="height:min(60dvh,520px);background:linear-gradient(180deg,#d9efff 0%,#eef8ff 55%,#e5f5df 100%)">
                <div style="position:absolute;left:0;right:0;bottom:0;height:16px;background:#bfe3a8"></div>
                <div id="catcher" style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:58px;line-height:1;transition:transform .1s"><span style="${emojiStyle(m)}">${formOf(m).e}</span></div>
            </div>
            <p class="text-xs text-center mt-2" style="color:var(--muted)">拖曳畫面或用 ← → 鍵移動</p>`;
        $('play-foot').innerHTML = `<div class="flex gap-2"><button class="btn white flex-1 text-2xl" id="g-left" aria-label="向左">◀</button><button class="btn white flex-1 text-2xl" id="g-right" aria-label="向右">▶</button></div>`;
        const arena = $('arena');
        const setX = e => { const r = arena.getBoundingClientRect(); g.x = Math.max(6, Math.min(94, (e.clientX - r.left) / r.width * 100)); };
        arena.onpointerdown = e => { g.drag = true; setX(e); };
        arena.onpointermove = e => { if (g.drag || e.pointerType === 'mouse') setX(e); };
        arena.onpointerup = arena.onpointerleave = () => { g.drag = false; };
        [['g-left', 'left'], ['g-right', 'right']].forEach(([id, k]) => {
            const b = $(id);
            b.onpointerdown = e => { e.preventDefault(); g.keys[k] = true; };
            b.onpointerup = b.onpointerleave = b.onpointercancel = () => { g.keys[k] = false; };
        });
        g.onKey = e => {
            const k = { ArrowLeft: 'left', ArrowRight: 'right', a: 'left', d: 'right' }[e.key];
            if (k) { e.preventDefault(); g.keys[k] = e.type === 'keydown'; }
        };
        document.addEventListener('keydown', g.onKey);
        document.addEventListener('keyup', g.onKey);
        newCatchTarget(g);
        g.raf = requestAnimationFrame(catchLoop);
    });
}

function newCatchTarget(g) {
    const prev = g.target;
    g.target = pick(g.words.filter(w => w !== prev));
    $('g-target').textContent = g.target.mean;
    // 舊目標還在空中的單字直接消失，避免混淆
    g.items = g.items.filter(it => { if (prev && it.w === prev) { it.el.remove(); return false; } return true; });
}

function catchLoop(now) {
    const g = G.game;
    if (!g || g.id !== 'catch' || g.over) return;
    const dt = Math.min(120, now - (g.last || now)); g.last = now;
    const elapsed = now - g.t0;
    const arena = $('arena');
    if (!arena) return;
    if (g.keys.left) { g.x -= dt * .07; g.dir = -1; }
    if (g.keys.right) { g.x += dt * .07; g.dir = 1; }
    g.x = Math.max(6, Math.min(94, g.x));
    const c = $('catcher');
    c.style.left = g.x + '%';
    c.style.transform = `translateX(-50%) scaleX(${g.dir})`;

    const interval = Math.max(520, 1050 - elapsed / 70);
    if (now - g.lastSpawn > interval) {
        g.lastSpawn = now;
        const hasTarget = g.items.some(it => it.w === g.target);
        const w = (!hasTarget || Math.random() < .35) ? g.target : pick(g.words.filter(x => x !== g.target));
        const el = document.createElement('div');
        el.className = 'fall';
        el.textContent = w.word;
        const x = 10 + Math.random() * 80;
        el.style.left = x + '%';
        arena.appendChild(el);
        g.items.push({ w, x, y: -8, vy: .022 + elapsed / 2.5e6 + Math.random() * .005, el });
    }

    g.items = g.items.filter(it => {
        it.y += it.vy * dt;
        it.el.style.top = it.y + '%';
        if (!it.checked && it.y >= 78) {
            it.checked = true;
            if (Math.abs(it.x - g.x) < 13) {
                it.el.remove();
                if (it.w === g.target) {
                    g.combo++;
                    const pts = 10 + Math.min(10, (g.combo - 1) * 2);
                    g.score += pts;
                    scorePop(arena, g.x, 70, `+${pts}${g.combo >= 3 ? ' 🔥' : ''}`, 'var(--green-d)');
                    playSound(g.combo >= 3 ? 'combo' : 'correct');
                    speak(it.w.word);
                    newCatchTarget(g);
                } else {
                    g.combo = 0; g.hearts--;
                    scorePop(arena, g.x, 70, `✗ ${it.w.word}`, 'var(--red-d)');
                    playSound('wrong');
                    arena.classList.remove('hurt'); void arena.offsetWidth; arena.classList.add('hurt');
                    buzz(60);
                }
                return false;
            }
        }
        if (it.y > 105) { it.el.remove(); return false; }
        return true;
    });

    const left = Math.max(0, Math.ceil((g.dur - elapsed) / 1000));
    $('g-score').textContent = g.score;
    $('g-time').textContent = left;
    $('g-hearts').textContent = '❤️'.repeat(Math.max(0, g.hearts)) + '🤍'.repeat(3 - Math.max(0, g.hearts));
    if (g.hearts <= 0 || left <= 0) return finishGame('catch', g.score, g.hearts <= 0 ? '愛心用完了，下次小心錯的單字！' : '時間到！');
    g.raf = requestAnimationFrame(catchLoop);
}

// ---------- 🫧 泡泡戳戳 ----------
function startBubble() {
    gameIntro('bubble', '上方會出現一個<b>中文意思</b>，寫著英文的泡泡會往上飄。<br>👉 <b>戳破</b>正確的泡泡得分，連續答對分數更高！<br>❌ 戳錯會扣 3 秒。總共 40 秒。', () => {
        const g = G.game = { id: 'bubble', words: gamePool(10), score: 0, combo: 0, items: [], t0: performance.now(), dur: 40000, penalty: 0, lastSpawn: 0 };
        gameHead();
        $('play-body').innerHTML = `<div class="text-center font-black my-2 text-lg">戳破「<span id="g-target" style="color:var(--blue-d)"></span>」</div>
            <div id="arena" class="arena" style="height:min(64dvh,560px);background:linear-gradient(180deg,#e8f6ff 0%,#cbe9ff 100%)"></div>`;
        newBubbleTarget(g);
        g.raf = requestAnimationFrame(bubbleLoop);
    });
}

function newBubbleTarget(g) {
    const prev = g.target;
    g.target = pick(g.words.filter(w => w !== prev));
    $('g-target').textContent = g.target.mean;
}

function spawnBubble(g, w) {
    const arena = $('arena');
    const size = 78 + Math.random() * 22;
    const el = document.createElement('button');
    el.className = 'bub';
    el.style.cssText = `width:${size}px;height:${size}px;font-size:${w.word.length > 9 ? 12 : 14}px;`;
    el.textContent = w.word;
    const it = { w, x: 4 + Math.random() * 70, y: 105, vy: .006 + Math.random() * .004, phase: Math.random() * 6, el, size };
    el.onpointerdown = e => { e.preventDefault(); popBubble(g, it); };
    arena.appendChild(el);
    g.items.push(it);
}

function popBubble(g, it) {
    if (it.dead || g.over) return;
    const arena = $('arena');
    if (it.w === g.target) {
        it.dead = true;
        it.el.classList.add('pop');
        setTimeout(() => it.el.remove(), 250);
        g.combo++;
        const pts = 10 + Math.min(15, (g.combo - 1) * 3);
        g.score += pts;
        scorePop(arena, it.x + 6, it.y, `+${pts}`, 'var(--blue-d)');
        playSound(g.combo >= 3 ? 'combo' : 'correct');
        speak(it.w.word);
        newBubbleTarget(g);
    } else {
        g.combo = 0;
        g.penalty += 3000;
        it.el.classList.remove('no'); void it.el.offsetWidth; it.el.classList.add('no');
        scorePop(arena, it.x + 6, it.y, '-3 秒', 'var(--red-d)');
        playSound('wrong');
    }
}

function bubbleLoop(now) {
    const g = G.game;
    if (!g || g.id !== 'bubble' || g.over) return;
    const dt = Math.min(120, now - (g.last || now)); g.last = now;
    const elapsed = now - g.t0;
    if (now - g.lastSpawn > 750) {
        g.lastSpawn = now;
        const live = g.items.filter(i => !i.dead);
        const hasTarget = live.some(i => i.w === g.target);
        if (live.length < 7) spawnBubble(g, (!hasTarget || Math.random() < .3) ? g.target : pick(g.words.filter(w => w !== g.target)));
    }
    g.items = g.items.filter(it => {
        if (it.dead) return false;
        it.y -= it.vy * dt;
        it.phase += dt / 600;
        it.el.style.left = `calc(${it.x}% + ${Math.sin(it.phase) * 10}px)`;
        it.el.style.top = it.y + '%';
        if (it.y < -25) { it.el.remove(); return false; }
        return true;
    });
    const left = Math.max(0, Math.ceil((g.dur - elapsed - g.penalty) / 1000));
    $('g-score').textContent = g.score;
    $('g-time').textContent = left;
    if (left <= 0) return finishGame('bubble', g.score, '時間到！');
    g.raf = requestAnimationFrame(bubbleLoop);
}

        $('play-body').innerHTML = `<div class="grid grid-cols-3 gap-2.5 mt-3 max-w-sm mx-auto">${cards.map((c, i) => `
            <button class="mcard" id="mc-${i}" onclick="flipCard(${i})" aria-label="翻牌">
                <div class="mcard-in"><div class="mface mback"><span style="${emojiStyle(m)}">${formOf(m).e}</span></div><div class="mface mfront ${c.en ? '' : ''}" style="${c.en ? 'color:var(--blue-d)' : ''}">${esc(c.text)}</div></div>
            </button>`).join('')}</div>`;
        g.tick = setInterval(() => { const el = $('g-time'); if (el) el.textContent = Math.floor((Date.now() - g.t0) / 1000); }, 500);
    });
}

function flipCard(i) {
    const g = G.game;
    if (!g || g.id !== 'memory' || g.lock) return;
    const c = g.cards[i];
    if (c.done || g.open.includes(i)) return;
    $(`mc-${i}`).classList.add('flip');
    playSound('tap');
    if (c.en) speak(c.text);
    g.open.push(i);
    if (g.open.length < 2) return;
    g.moves++;
    $('g-moves').textContent = g.moves;
    const [a, b] = g.open.map(x => g.cards[x]);
    if (a.k === b.k && a.en !== b.en) {
        g.open.forEach(x => { g.cards[x].done = true; $(`mc-${x}`).classList.add('done'); });
        g.open = [];
        g.matched++;
        playSound('correct');
        g.score = g.matched * 10;
        $('g-score').textContent = g.score;
        if (g.matched === 6) {
            const secs = Math.floor((Date.now() - g.t0) / 1000);
            const score = Math.max(20, 150 - Math.max(0, g.moves - 6) * 6 - secs);
            setTimeout(() => finishGame('memory', score, `翻了 ${g.moves} 次，用了 ${secs} 秒`), 600);
        }
    } else {
        g.lock = true;
        g.open.forEach(x => $(`mc-${x}`).classList.add('miss'));
        setTimeout(() => {
            g.open.forEach(x => { const el = $(`mc-${x}`); el?.classList.remove('flip', 'miss'); });
            g.open = [];
            g.lock = false;
        }, 850);
    }
}

// ============================================================
// ⚔️ 怪獸對戰競技場（離線，題目來自圖鑑）
// ============================================================
const SP_EL = { dragon: 'fire', sea: 'water', cat: 'night', bird: 'wind', bunny: 'dream', bug: 'grass', dino: 'rock', ghost: 'star' };
const ELEM = {
    fire:  { n: '火', e: '🔥', beats: ['grass', 'star'] },
    water: { n: '水', e: '💧', beats: ['fire', 'rock'] },
    grass: { n: '草', e: '🌿', beats: ['water', 'rock'] },
    wind:  { n: '風', e: '🌪️', beats: ['grass', 'dream'] },
    rock:  { n: '岩', e: '🪨', beats: ['fire', 'wind'] },
    night: { n: '夜', e: '🌙', beats: ['dream', 'star'] },
    dream: { n: '夢', e: '🌈', beats: ['night', 'water'] },
    star:  { n: '星', e: '⭐', beats: ['night', 'wind'] }
};
const TRAINERS = [
    { name: '新手小明',   lv: 2,  sp: 'bug' },    { name: '甜點師小美', lv: 3,  sp: 'bunny' },
    { name: '登山客阿強', lv: 4,  sp: 'dino' },   { name: '游泳選手莉莉', lv: 5, sp: 'sea' },
    { name: '夜貓子大雄', lv: 6,  sp: 'cat' },    { name: '飛行教練 Max', lv: 7, sp: 'bird' },
    { name: '火焰雙胞胎', lv: 8,  sp: 'dragon' }, { name: '幽靈少女 Mia', lv: 10, sp: 'ghost' },
    { name: '冠軍候補 Leo', lv: 12, sp: 'dino' }, { name: '競技場冠軍 Aurora', lv: 14, sp: 'dragon' }
];
function elOf(species) { return ELEM[SP_EL[species] || 'fire']; }
function typeMult(atkSp, defSp) {
    const a = SP_EL[atkSp], d = SP_EL[defSp];
    if (ELEM[a].beats.includes(d)) return 1.5;
    if (ELEM[d].beats.includes(a)) return 0.75;
    return 1;
}
function battleStats(lv, species) {
    const [h, a, d, s] = SP_STAT[species] || [1, 1, 1, 1];
    return { max: Math.round((50 + lv * 8) * h), atk: Math.round((10 + lv * 2.3) * a), def: Math.round((4 + lv * 1.2) * d), spd: Math.round((8 + lv * 1.5) * s) };
}
// 對戰中的一方：能力值 + 場上的能力變化倍率、護盾、技能剩餘次數
function battleSide(st, species, lv, name) {
    const skills = skillsOf(species, lv);
    return { ...st, hp: st.max, sp: species, name, mAtk: 1, mDef: 1, mSpd: 1, shield: 0, skills, pp: Object.fromEntries(skills.map(k => [k.n, k.pp])) };
}
// 速度越快越容易閃過對手的攻擊（3%～25%）
function missChance(a, d) { return Math.min(.25, Math.max(.03, .06 + (d.spd * d.mSpd - a.spd * a.mSpd) * .012)); }
function multText(k) { return k > 1 ? '<b style="color:var(--green-d)">效果絕佳</b>' : k < 1 ? '<b style="color:var(--red-d)">效果不好</b>' : '普通'; }

function openArena() {

    closeModal();
    stopGame();
    G.play = { kind: 'arena', phase: 'lobby', finished: true };
    openPlay(); hideSheet();

    $('play-body').innerHTML = `<div class="anim-in">
        <div class="card p-4 flex items-center gap-3 arena-me">

                <div class="text-xs" style="color:var(--muted)">屬性 ${el.e}${el.n}・HP ${monBattleStats(m).max}・攻 ${monBattleStats(m).atk}・防 ${monBattleStats(m).def}・速 ${monBattleStats(m).spd}・戰績 ${S.arena.wins} 勝 ${S.arena.losses} 敗</div>
                <div class="text-xs mt-1" style="color:var(--muted)">${el.e}${el.n} 剋 ${el.beats.map(b => ELEM[b].e + ELEM[b].n).join('、')}</div></div>

        <div class="space-y-2">${TRAINERS.map((t, i) => {

                    <div class="text-xs" style="color:var(--muted)">Lv.${t.lv}・${fe.e}${fe.n}${open ? `・我方攻擊 ${multText(k)}` : ''}</div></div>
                ${beaten ? '<span class="pill" style="background:var(--green-t);color:var(--green-d)">✓ 已擊敗</span>' : open ? '<span class="btn sm red">挑戰</span>' : '<span>🔒</span>'}
            </button>`; }).join('')}</div>
    </div>`;
    $('play-foot').innerHTML = '';
}

function startBattle(i) {
    const m = activeMon();
    const t = TRAINERS[i];
    stopGame();
    let words = Object.values(S.dex).filter(d => d.mean);
    if (words.length < 4) words = [...words, ...BASIC_WORDS.filter(b => !words.some(x => x.word === b.word))];
    const foeName = SPECIES.find(s => s.id === t.sp).forms[formIdx(t.lv)].n;
    const b = G.game = { id: 'battle', i, t, words, heals: 2,
        me: battleSide(monBattleStats(m), m.species, levelInfo(m).lv, m.name), foe: battleSide(battleStats(t.lv, t.sp), t.sp, t.lv, foeName), busy: false, log: `${t.name} 派出了 ${foeName}！` };
    G.play = { kind: 'arena', phase: 'battle', finished: false };
    openPlay(); hideSheet();
    b.onKey = e => {
        if (G.modalOpen || !G.game || G.game.id !== 'battle') return;
        if (/^[1-6]$/.test(e.key)) { const btn = document.querySelector(`#battle-panel [data-k="${e.key}"]`); if (btn && !btn.disabled) btn.click(); }
    };
    document.addEventListener('keydown', b.onKey);
    renderBattle();
    playSound('pop');
    if (b.foe.spd > b.me.spd) {
        b.busy = true;
        setTimeout(() => { if (G.game !== b) return; setLog(`💨 ${esc(foeName)} 的速度比較快，搶先出手！`); setTimeout(foeTurn, 900); }, 700);
    }
}

function renderBattle() {

function renderMoves() {
    const b = G.game, m = activeMon(), el = elOf(m.species);
    const k = typeMult(m.species, b.t.sp), color = SPECIES.find(s => s.id === m.species).color;
    const mv = (key, kind, icon, name, note, dis, border) => `<button class="move" data-k="${key}" ${kind ? `onclick="chooseMove('${kind}')"` : ''} ${dis ? 'disabled' : ''} style="padding:.5rem .55rem;gap:.4rem;${border ? `border-color:${border}` : ''}"><span class="text-2xl">${icon}</span><span class="flex-1 text-left min-w-0"><b class="block text-sm truncate">${name}</b><span class="block text-[11px] leading-tight" style="color:var(--muted)">${note}</span></span></button>`;
    $('play-foot').innerHTML = '';
    $('battle-panel').innerHTML = `<div class="grid grid-cols-2 gap-2">
        ${mv(1, 'hit', '💥', '撞擊', '選中文意思・穩定傷害')}
        ${mv(2, 'special', el.e, `${el.n}屬性必殺`, `看中文選英文・威力×1.6・${multText(k)}`, false, color)}
        ${mv(3, 'heal', '💚', `恢復（剩 ${b.heals}）`, '聽音辨字・回復 35% HP', !b.heals)}
        ${SKILLS[m.species].map((sk, i) => b.me.skills.includes(sk)
            ? mv(4 + i, 'sk' + i, sk.e, `${sk.n}（剩 ${b.me.pp[sk.n]}）`, skillDesc(sk), !b.me.pp[sk.n], color)
            : mv(4 + i, '', '🔒', `Lv.${SKILL_LV[i]} 學會`, '還沒學會的技能', true)).join('')}
    </div>`;
}

function chooseMove(kind) {
    const b = G.game;
    if (!b || b.busy) return;
    if (kind === 'heal' && !b.heals) return;
    const sk = kind.startsWith('sk') ? SKILLS[b.me.sp][Number(kind[2])] : null;
    if (sk && !b.me.pp[sk.n]) return;
    const w = pick(b.words);
    // 越強的招式題目越難：撞擊與 Lv.3 技能選中文、Lv.6 技能看中文選英文、必殺與 Lv.9 技能可能出填空
    const type = kind === 'hit' || kind === 'sk0' ? 'meaning' : kind === 'heal' ? 'listen' : kind === 'sk1' ? 'reverse' : (blankSentence(w) && Math.random() < .5 ? 'fill' : 'reverse');
    const c = makeChallenge(type, w, b.words);
    b.move = kind; b.sk = sk; b.q = c;
    const prompt = type === 'meaning' ? `<div class="text-3xl font-black">${esc(w.word)}</div>`
        : type === 'listen' ? `<button class="btn blue" onclick="speak(G.game.q.w.word)">🔊 再聽一次</button>`
        : type === 'fill' ? `<div class="text-lg">${esc(c.sentence).replace('_____', '<u>　　　</u>')}</div>`
        : `<div class="text-2xl font-black" style="color:var(--green-d)">${esc(w.mean)}</div>`;
    $('battle-panel').innerHTML = `<div class="card p-3 text-center anim-in">
        <div class="text-xs font-black mb-2" style="color:var(--muted)">${c.label}</div>${prompt}
        <div class="bar timer mt-3" style="height:6px"><i id="timer-bar" style="width:100%"></i></div></div>
        <div class="grid grid-cols-2 gap-2 mt-2">${c.options.map((o, i) => `<button class="opt center" data-k="${i + 1}" data-i="${i}" onclick="battleAnswer(${i})"><span class="flex-1 break-words">${esc(o)}</span></button>`).join('')}</div>`;
    if (c.autoSpeak) setTimeout(() => speak(w.word), 200);
    stopTimer();
    const t0 = Date.now(), sec = 12;
    G.timer = setInterval(() => {
        const left = sec - (Date.now() - t0) / 1000, bar = $('timer-bar');
        if (bar) bar.style.width = Math.max(0, left / sec * 100) + '%';
        if (left <= 0) battleAnswer(-1);
    }, 100);
}

function battleFx(target, text, color) {
    const el = $(target === 'foe' ? 'foe-mon' : 'me-mon');
    if (!el) return;
    el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');
    const n = document.createElement('div');
    n.className = 'score-pop';
    n.style.cssText = `left:50%;top:0;color:${color};font-size:1.6rem;text-shadow:0 2px 0 #fff`;
    n.textContent = text;
    el.appendChild(n);
    setTimeout(() => n.remove(), 800);
}
function lunge(who) {
    const el = $(who === 'me' ? 'me-mon' : 'foe-mon');
    if (!el) return;
    el.classList.remove('lunge-me', 'lunge-foe'); void el.offsetWidth; el.classList.add(who === 'me' ? 'lunge-me' : 'lunge-foe');
}
function setLog(t) { const el = $('battle-log'); if (el) el.innerHTML = t; G.game.log = t; }
function refreshHp() {
    const b = G.game;
    document.querySelectorAll('.hp-card .bar > i').forEach((bar, idx) => {
        const x = idx === 0 ? b.foe : b.me;
        bar.style.width = Math.max(0, x.hp / x.max * 100) + '%';
        if (x.hp / x.max < .3) bar.style.background = 'var(--red)';
    });
    document.querySelectorAll('.hp-card .text-right').forEach((t, idx) => { const x = idx === 0 ? b.foe : b.me; t.textContent = `${Math.max(0, Math.ceil(x.hp))}/${x.max}`; });
}

function battleAnswer(i) {
    const b = G.game;
    if (!b || b.id !== 'battle' || b.busy) return;
    b.busy = true;
    stopTimer();
    const c = b.q, m = activeMon();
    const ok = i >= 0 && c.options[i] === c.answer;
    document.querySelectorAll('#battle-panel .opt').forEach(btn => {
        btn.disabled = true;
        if (c.options[Number(btn.dataset.i)] === c.answer) btn.classList.add('ok');
        if (Number(btn.dataset.i) === i && !ok) btn.classList.add('bad');
    });
    S.totals.answered++;
    if (ok) { S.totals.correct++; progressEggs(1); }
    const key = c.w.word.toLowerCase();
    if (S.dex[key]) { if (ok) S.dex[key].correct++; else { S.dex[key].wrong++; srsHit(S.dex[key], false); } }

    setTimeout(() => {
        if (!ok) {
            playSound('wrong');
            setLog(`${i < 0 ? '⏰ 太慢了！' : '答錯了…'}招式失敗！（${esc(c.w.word)} = ${esc(c.w.mean)}）`);
        } else if (b.move === 'heal') {
            b.heals--;
            const amt = Math.round(b.me.max * .35);
            b.me.hp = Math.min(b.me.max, b.me.hp + amt);
            battleFx('me', `+${amt}`, 'var(--green-d)');
            playSound('coin');
            setLog(`💚 ${esc(m.name)} 回復了 ${amt} HP！`);
        } else {
            const el = elOf(m.species);
            setLog(doAction('me', b.sk ? { sk: b.sk } : b.move === 'special' ? { pow: 1.6, e: el.e, label: ` 的${el.n}屬性必殺` } : { pow: 1, plain: true, e: '💥', label: ' 的撞擊' }));
        }
        refreshHp();
        setTimeout(() => {
            if (G.game !== b) return;
            if (b.foe.hp <= 0) return endBattle(true);
            foeTurn();
        }, 1300);
    }, 450);
}

// 執行一次攻擊或技能（who = 'me' | 'foe'），回傳戰鬥紀錄文字
function doAction(who, act) {
    const b = G.game, other = who === 'me' ? 'foe' : 'me', a = b[who], d = b[other], sk = act.sk;
    const head = `${sk ? sk.e : act.e} ${esc(a.name)}${sk ? ` 使出「${sk.n}」` : act.label}`;
    const pow = sk ? sk.pow : act.pow, notes = [];
    let main = '';
    if (sk) a.pp[sk.n]--;
    if (pow) {
        lunge(who);
        if (Math.random() < missChance(a, d)) { playSound('pop'); return `${head}，但是被 ${esc(d.name)} 躲開了！`; }
        const k = act.plain ? 1 : typeMult(a.sp, d.sp);
        const crit = !!sk?.crit || Math.random() < (who === 'me' ? 0.05 + hearts(activeMon()) * 0.04 : 0.05);
        const guard = d.shield > 0 ? .5 : 1;
        if (guard < 1) { d.shield--; notes.push('護盾擋下一半'); }
        let total = 0;
        for (let h = 0; h < (sk?.hits || 1); h++) {
            const dmg = Math.max(1, Math.round(a.atk * a.mAtk * pow * k * (0.9 + Math.random() * 0.2) * (crit ? 1.5 : 1) * guard * 60 / (60 + d.def * d.mDef)));
            total += dmg;
            setTimeout(() => { if (G.game !== b) return; d.hp -= dmg; battleFx(other, `-${dmg}`, 'var(--red-d)'); refreshHp(); if (other === 'me') buzz(60); }, 220 + h * 300);
        }
        main = `，造成 ${total} 點傷害`;
        if (sk?.hits > 1) notes.push(`${sk.hits} 連擊`);
        if (crit) notes.push('<b style="color:var(--orange-d)">會心一擊</b>');
        if (k !== 1) notes.push(multText(k));
        if (sk?.drain) {
            const heal = Math.round(total * sk.drain);
            setTimeout(() => { if (G.game !== b) return; a.hp = Math.min(a.max, a.hp + heal); battleFx(who, `+${heal}`, 'var(--green-d)'); refreshHp(); }, 600);
            notes.push(`吸收 ${heal} HP`);
        }
        playSound(who === 'foe' ? 'wrong' : crit ? 'combo' : 'correct');
    } else playSound('coin');
    const cap = k => 'm' + k[0].toUpperCase() + k.slice(1);
    Object.entries(sk?.self || {}).forEach(([k, v]) => { a[cap(k)] = Math.min(2, a[cap(k)] * v); notes.push(`自己的${STAT_NAME[k]}提升`); });
    Object.entries(sk?.foe || {}).forEach(([k, v]) => { d[cap(k)] = Math.max(.5, d[cap(k)] * v); notes.push(`${esc(d.name)} 的${STAT_NAME[k]}下降`); });
    if (sk?.shield) { a.shield = sk.shield; notes.push(`接下來 ${sk.shield} 次受到的傷害減半`); }
    return `${head}${main}！${notes.length ? `（${notes.join('・')}）` : ''}`;
}

function foeTurn() {
    const b = G.game;
    if (!b || b.id !== 'battle') return;
    // 對手有三成機率使用還有次數的技能（已經疊滿的強化、還有護盾時不重複用）
    const usable = b.foe.skills.filter(k => b.foe.pp[k.n] > 0 && !(k.shield && b.foe.shield) && !(k.self && !k.pow && Object.keys(k.self).some(s => b.foe['m' + s[0].toUpperCase() + s.slice(1)] > 1.5)));
    const sk = usable.length && Math.random() < 0.3 ? pick(usable) : null;
    setLog(doAction('foe', sk ? { sk } : { pow: 1, e: elOf(b.t.sp).e, label: ' 反擊' }));
    setTimeout(() => {
        if (G.game !== b) return;
        if (b.me.hp <= 0) return endBattle(false);
        b.busy = false;
        renderMoves();
    }, 1300);
}

function endBattle(win) {
    const b = G.game, m = activeMon();
    stopGame(); stopTimer();
    G.play.finished = true;
    let coins, xp = 0, extra = '';
    if (win) {
        const first = b.i === S.arena.rank;
        if (first) S.arena.rank = Math.min(TRAINERS.length, S.arena.rank + 1);
        S.arena.wins++;
        const am = activeMon();
        if (am) {
            am.wins = (am.wins || 0) + 1;
            if (am.wins === BRANCH_NEED.battle && isFinal(am)) toast(`⚔️ ${am.name} 可以變成戰鬥型了！點名字切換型態`, 'gold', 3600);
        }
        S.arena.trophies += first ? 10 + b.i * 5 : 3;
        coins = first ? 20 + b.i * 10 : 8;
        xp = addMonsterXP(first ? 10 + b.i * 4 : 5);
        cheer(15); addAffection(2);
        if (first && b.i === TRAINERS.length - 1) extra = '<div class="mt-4 p-3 rounded-2xl font-black" style="background:#fff1c2;color:#8a6500">🥇 你成為了競技場冠軍！</div>';
        else if (first && TRAINERS[b.i + 1]) extra = `<div class="mt-4 p-3 rounded-2xl font-black" style="background:var(--green-t);color:var(--green-d)">🔓 新對手：${esc(TRAINERS[b.i + 1].name)}</div>`;
        playSound('win'); burst();
    } else {
        S.arena.losses++;
        coins = 5;
        cheer(-5);
        playSound('fail');
        extra = `<p class="mt-3 text-sm" style="color:var(--muted)">💡 先練等級，或換一隻屬性相剋的怪獸再來！</p>`;
    }
    S.coins += coins;
    markActive();
    save();
    $('play-head').innerHTML = '';
    $('play-body').innerHTML = `<div class="text-center pt-8 anim-in">
        <div class="text-6xl">${win ? '🏆' : '💫'}</div>
        <div class="text-3xl font-black mt-3">${win ? '勝利！' : '輸了…'}</div>
        <div class="my-4">${monsterHTML(96, false)}</div>
        <div class="font-black">${win ? `${esc(m.name)} 打敗了 ${esc(b.t.name)}！` : `${esc(m.name)} 累倒了…`}</div>
        <div class="grid grid-cols-2 gap-2 mt-4 max-w-xs mx-auto">
            <div class="card p-3"><div class="text-xl font-black" style="color:#a67c00">+${coins}</div><div class="text-xs" style="color:var(--muted)">🪙 金幣</div></div>
            <div class="card p-3"><div class="text-xl font-black" style="color:var(--orange-d)">+${xp}</div><div class="text-xs" style="color:var(--muted)">⭐ 經驗</div></div>
        </div>${extra}
    </div>`;
    $('play-foot').innerHTML = `<div class="flex gap-2"><button class="btn white flex-1" onclick="openArena()">回競技場</button><button class="btn red flex-1" onclick="startBattle(${win && TRAINERS[b.i + 1] && b.i + 1 <= S.arena.rank ? b.i + 1 : b.i})">${win && TRAINERS[b.i + 1] ? '下一位對手' : '再戰一次'}</button></div>`;
    if (G.modalQueue.length) setTimeout(runModalQueue, 900);
}

async function startGrammar(i) {
    if (!apiKey) return openKeyModal(true);
    const t = GRAMMAR_TOPICS[i];
    G.play = { kind: 'grammar', topic: t, phase: 'loading' };
    openPlay();
    playLoading('道館老師正在出題…', `${t.e} ${t.label}`, '🏯');
    try {
        S.grammarSeen = S.grammarSeen || [];
        const d = await callClaudeJSON(JSON_SYSTEM, grammarPrompt(t.value, S.grammarSeen));
        if (!G.play || G.play.kind !== 'grammar') return;
        const quiz = (d.quiz || []).filter(q => q?.question && Array.isArray(q.options) && q.options.length >= 2 && Number(q.answer) >= 0 && Number(q.answer) < q.options.length);
        if (!quiz.length) throw new ClaudeError('題目不完整，再試一次。', 200);
        quiz.forEach(q => S.grammarSeen.push(q.question));
        S.grammarSeen = S.grammarSeen.slice(-60);
        const queue = quiz.map(q => ({ type: 'grammar', label: '選出正確答案', question: q.question, options: q.options.map(String), answer: String(q.options[Number(q.answer)]), reason: q.reason }));
        Object.assign(G.play, { phase: 'lesson', lesson: d, queue, qi: 0, hearts: Infinity, mistakes: 0, combo: 0, maxCombo: 0, done: 0, total: queue.length });
        renderLesson();
    } catch (e) {
        if (G.play) playError(e.message, `startGrammar(${i})`);
    }
}

// ---------- 拼字 ----------
function renderSpell() {
    const c = G.play.queue[G.play.qi];
    let k = 0;
    // 依字數縮放格子，長單字在手機上也能排在同一行
    const box = $('spell-slots');
    const w = Math.max(18, Math.min(36, Math.floor((box.clientWidth || 320) / [...c.w.word].length) - 4));
    box.innerHTML = [...c.w.word].map(ch => {
        if (!/[a-z]/i.test(ch)) return `<span class="slot fixed">${ch === ' ' ? '&nbsp;' : esc(ch)}</span>`;
        const t = c.picked[k++];
        return `<span class="slot ${t !== undefined ? 'filled' : ''}" style="min-width:${w}px;font-size:${Math.min(24, w * .75)}px">${t !== undefined ? c.tiles[t].ch : ''}</span>`;
    }).join('');
    $('spell-tiles').innerHTML = c.tiles.map((t, i) => `<button class="tile ${c.picked.includes(i) ? 'used' : ''}" onclick="spellPick(${i})">${t.ch}</button>`).join('');
}
function spellPick(i) {
    const c = G.play?.queue[G.play.qi];
    if (!c || c.type !== 'spell' || G.play.locked || c.picked.includes(i)) return;
    const need = [...c.w.word].filter(ch => /[a-z]/i.test(ch)).length;
    if (c.picked.length >= need) return;
    c.picked.push(i);
    playSound('tap');
    renderSpell();
    if (c.picked.length === need) setTimeout(spellCheck, 220);
}
function spellUndo() { const c = G.play?.queue[G.play.qi]; if (c?.picked.length && !G.play.locked) { c.picked.pop(); renderSpell(); } }
function spellKey(ch) {
    const c = G.play?.queue[G.play.qi];
    if (!c || c.type !== 'spell') return;
    const i = c.tiles.findIndex((t, idx) => t.ch === ch && !c.picked.includes(idx));
    if (i >= 0) spellPick(i);
}
function spellCheck() {
    const c = G.play?.queue[G.play.qi];
    if (!c || G.play.locked) return;
    const need = [...c.w.word].filter(ch => /[a-z]/i.test(ch)).length;
    if (c.picked.length < need) return toast('還沒拼完喔');
    const guess = c.picked.map(i => c.tiles[i].ch).join('');
    resolve(norm(guess) === norm(c.w.word), guess);
}

// ---------- 單字組合 ----------
function renderCombine() {
    const c = G.play.queue[G.play.qi];
    const slot = i => {
        const pi = c.picked[i];
        return `<span class="px-4 py-3 rounded-2xl font-black text-2xl min-w-[90px] text-center" style="border:3px ${pi === undefined ? 'dashed #c9d6c3' : `solid ${i ? 'var(--blue)' : 'var(--purple)'}`};color:${i ? 'var(--blue-d)' : 'var(--purple-d)'};background:#fff">${pi === undefined ? '?' : esc(c.pieces[pi])}</span>`;
    };
    $('combine-slots').innerHTML = `${slot(0)}<span class="text-2xl font-black" style="color:var(--muted)">+</span>${slot(1)}`;
    $('combine-pieces').innerHTML = c.pieces.map((p, i) => `<button class="tile ${c.picked.includes(i) ? 'used' : ''}" style="font-size:1.15rem;padding:0 1rem" onclick="combinePick(${i})"><span class="text-xs mr-1 opacity-50">${i + 1}</span>${esc(p)}</button>`).join('');
}
function combinePick(i) {
    const c = G.play?.queue[G.play.qi];
    if (!c || c.type !== 'combine' || G.play.locked || c.picked.includes(i) || c.picked.length >= 2) return;
    c.picked.push(i);
    playSound('tap');
    renderCombine();
    if (c.picked.length === 2) setTimeout(() => {
        const guess = c.picked.map(x => c.pieces[x]).join('');
        resolve(norm(guess) === norm(c.w.word), guess);
    }, 250);
}
function combineUndo() { const c = G.play?.queue[G.play.qi]; if (c?.picked.length && !G.play.locked) { c.picked.pop(); renderCombine(); } }

function rerollStage() {

// ---------- 語音輸入 ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function listen(lang, onText, onDone) {
    if (!SR) { toast('這個瀏覽器不支援語音輸入，請用 Chrome 或 Edge', 'bad'); return; }
    stopListen();
    const r = new SR();
    r.lang = lang;
    r.interimResults = true;
    r.maxAlternatives = 4;
    G.rec = r;
    r.onresult = e => {
        let fin = '', tmp = '';
        const alts = [];
        for (let i = e.resultIndex; i < e.results.length; i++) {
            const res = e.results[i];
            if (res.isFinal) { fin += res[0].transcript; for (let j = 0; j < res.length; j++) alts.push(res[j].transcript); }
            else tmp += res[0].transcript;
        }
        onText((fin || tmp).trim(), !!fin, alts);
    };
    r.onerror = e => {
        const msg = { 'not-allowed': '請允許瀏覽器使用麥克風', 'no-speech': '沒聽到聲音，再試一次', 'audio-capture': '找不到麥克風', network: '語音辨識需要網路連線' }[e.error];
        if (e.error !== 'aborted') toast(msg || '語音辨識出錯了，再試一次', 'bad');
    };
    r.onend = () => { if (G.rec === r) G.rec = null; onDone?.(); };
    try { r.start(); } catch { G.rec = null; onDone?.(); toast('無法啟動語音辨識，再試一次', 'bad'); }
}
function stopListen() {
    const r = G.rec;
    G.rec = null;
    if (r) { try { r.abort(); } catch {} }
}

// 拼字題、組合題可以直接把單字唸出來
function voiceAnswer() {
    const p = G.play;
    const c = p?.queue[p.qi];
    const btn = $('voice-btn');
    if (!c || p.locked) return;
    if (G.rec) { stopListen(); return; }
    let answered = false;
    btn.textContent = '👂 聆聽中…'; btn.classList.add('wiggle');
    listen('en-US', (text, final, alts) => {
        if (!final || answered || G.play !== p || p.qi !== p.queue.indexOf(c)) return;
        answered = true;
        stopListen();
        const ok = [text, ...alts].some(t => norm(t) === norm(c.w.word));
        bumpStat('voice'); resolve(ok, text);
    }, () => { const b = $('voice-btn'); if (b) { b.textContent = '🎤'; b.classList.remove('wiggle'); } });
}

// ---------- 作答 ----------
function answerOption(i) {
    const p = G.play;
    if (!p || p.locked) return;
    const c = p.queue[p.qi];
    const ok = i >= 0 && c.options[i] === c.answer;
    document.querySelectorAll('#play-body .opt').forEach(b => {
        b.disabled = true;
        if (c.options[Number(b.dataset.i)] === c.answer) b.classList.add('ok');
        if (Number(b.dataset.i) === i && !ok) b.classList.add('bad');
    });
    resolve(ok, i >= 0 ? c.options[i] : '');
}

function resolve(ok, given) {
    const p = G.play;
    if (!p || p.locked) return;
    p.locked = true;
    stopTimer();
    const c = p.queue[p.qi];
    S.totals.answered++;
    const key = c.w?.word.toLowerCase();
    if (ok) {
        S.totals.correct++;
        p.done++; p.combo++; p.maxCombo = Math.max(p.maxCombo, p.combo); S.stats.maxCombo = Math.max(S.stats.maxCombo || 0, p.combo);
        if (p.kind === 'boss') {
            p.bossHp--;
            const am = activeMon(), sk = am && skillsOf(am.species, levelInfo(am).lv).pop();
            if (sk && p.combo % 3 === 0 && p.bossHp > 0) { p.bossHp--; toast(`${sk.e} ${am.name} 使出「${sk.n}」！魔王多受 1 點傷害`, 'gold', 2600); }
        }
        if (p.kind === 'review' && S.dex[key]) { S.dex[key].correct++; S.dex[key].seen = Date.now(); srsHit(S.dex[key], true); S.coins += 2; cheer(1); bumpQuest('reviews'); S.stats.reviews = (S.stats.reviews || 0) + 1; }
        if (p.kind === 'fun') S.coins += 1;
        progressEggs(1);
        if (p.kind === 'grammar') S.coins += 3;
        if (p.kind === 'boss' && S.dex[key]) { S.dex[key].correct++; srsHit(S.dex[key], true); }
        playSound(p.combo >= 3 ? 'combo' : 'correct');
        throwBall(p.kind === 'boss' ? '💥' : '⚾');
    } else {
        p.combo = 0; p.mistakes++;
        if (p.hearts !== Infinity) p.hearts--;
        if ((p.kind === 'review' || p.kind === 'boss') && S.dex[key]) { S.dex[key].wrong++; S.dex[key].seen = Date.now(); srsHit(S.dex[key], false); }
        if (p.kind === 'stage' && key) (p.wrongSet = p.wrongSet || new Set()).add(key);
        // 答錯的題目放到最後再考一次（文法題除外）
        if (p.kind !== 'grammar') {
            const again = makeChallenge(c.type, c.w, p.words || p.queue.map(q => q.w));
            p.queue.push(again);
        }
        playSound('wrong');
        buzz(80);
    }
    save();
    renderPlayHead();

    const praise = ['抓到了！', '太厲害了！', '完美！', '漂亮！', '答對了！'];
    const title = ok ? (p.kind === 'boss' ? '命中！魔王受到傷害' : pick(praise)) : (given === '' && c.type !== 'spell' ? '沒關係，記下來' : '差一點！');
    let detail = '';
    if (c.type === 'grammar') detail = `${ok ? '' : `正確答案：<b>${esc(c.answer)}</b><br>`}${esc(c.reason || '')}`;
    else if (c.w) detail = `<b>${esc(c.w.word)}</b> ${esc(c.w.ipa || '')} — ${esc(c.w.mean)}${!ok && c.w.example ? `<div class="mt-1 font-semibold opacity-80">${esc(c.w.example)}</div>` : ''}`;
    showSheet(ok, title, detail);
    if (c.w && (!ok || ['spell', 'reverse', 'fill', 'combine'].includes(c.type))) speak(c.w.word);
}

function showSheet(ok, title, detail) {
    const sheet = $('sheet');
    sheet.className = `sheet show ${ok ? 'good' : 'bad'}`;
    const p = G.play;
    $('sheet-inner').innerHTML = `<div class="flex items-start gap-3 mb-3">
        <div class="text-4xl">${ok ? '🎉' : '💦'}</div>
        <div class="flex-1 min-w-0" style="color:${ok ? 'var(--green-d)' : 'var(--red-d)'}">
            <div class="text-xl font-black">${title}${ok && p.combo >= 3 ? ` 🔥×${p.combo}` : ''}</div>
            <div class="text-sm mt-0.5 break-words">${detail}</div>
        </div>
    </div>
    <button class="btn ${ok ? '' : 'red'} w-full text-lg" onclick="nextChallenge()">繼續 <span class="kbd" style="color:#fff">Enter</span></button>`;
    $('play-foot').innerHTML = '';
}
function hideSheet() { $('sheet').className = 'sheet'; }

function nextChallenge() {
    const p = G.play;
    if (!p || !p.locked) return;
    stopListen();
    hideSheet();
    if (p.hearts <= 0) return failRun();
    if (p.kind === 'boss' && p.bossHp <= 0) return finishRun();
    p.qi++;
    if (p.kind === 'review' || p.kind === 'grammar' || p.kind === 'fun') { if (p.qi >= p.total) return finishRun(); }
    else if (p.qi >= p.queue.length) return finishRun();
    renderChallenge();
}

// ---------- 計時（魔王） ----------
function startTimer(sec) {
    stopTimer();
    const t0 = Date.now();
    G.timer = setInterval(() => {
        const left = sec - (Date.now() - t0) / 1000;
        const bar = $('timer-bar');
        if (bar) { bar.style.width = Math.max(0, left / sec * 100) + '%'; bar.style.background = left < 5 ? 'var(--red)' : 'var(--orange)'; }
        if (left <= 0) {
            stopTimer();
            document.querySelectorAll('#play-body .opt').forEach(b => { b.disabled = true; if (G.play.queue[G.play.qi].options?.[Number(b.dataset.i)] === G.play.queue[G.play.qi].answer) b.classList.add('ok'); });
            toast('⏰ 時間到！', 'bad', 1500);
            resolve(false, '');
        }
    }, 100);
}
function stopTimer() { if (G.timer) { clearInterval(G.timer); G.timer = null; } }

function throwBall(emoji) {
    const el = document.createElement('div');
    el.className = 'ball';
    el.textContent = emoji;
    $('play-body').appendChild(el);
    setTimeout(() => el.remove(), 750);
}

// ---------- 結算 ----------
function failRun() {
    const p = G.play;
    p.finished = true;
    playSound('fail');
    const retry = p.kind === 'boss' ? `startBoss('${p.region.id}')` : p.kind === 'stage' ? `retryStage()` : 'closePlay()';
    $('play-head').innerHTML = '';
    $('play-body').innerHTML = `<div class="text-center pt-14 anim-in">
        <div class="text-7xl">${p.kind === 'boss' ? p.region.boss : '😵‍💫'}</div>
        <div class="text-3xl font-black mt-5">${p.kind === 'boss' ? `${esc(p.region.bossName)} 太強了…` : '單字逃走了…'}</div>
        <p class="mt-2" style="color:var(--muted)">愛心用完了。別灰心，${p.kind === 'boss' ? '先去訓練場複習再來挑戰！' : '同一批單字再試一次吧！'}</p>
    </div>`;
    $('play-foot').innerHTML = `<div class="flex gap-2"><button class="btn white flex-1" onclick="closePlay()">回地圖</button><button class="btn flex-[2]" onclick="${retry}">再挑戰一次</button></div>`;
}

function retryStage() {
    const p = G.play;
    Object.assign(p, { phase: 'quiz', queue: stageChallenges(p.words), qi: 0, hearts: 3, mistakes: 0, combo: 0, maxCombo: 0, done: 0, finished: false });
    renderChallenge();
}

function finishRun() {
    const p = G.play;
    p.finished = true;
    markActive();
    let coins = 0, xp = 0, food = 0, stars = 0, headline = '', extra = '';

    if (p.kind === 'stage') {
        stars = p.mistakes === 0 ? 3 : p.mistakes <= 2 ? 2 : 1;
        const pr = p.workshop ? null : prog(p.region.id);
        const firstClear = !!pr && pr.stars[p.idx] === 0;
        if (pr) pr.stars[p.idx] = Math.max(pr.stars[p.idx], stars);
        let newCount = 0;
        p.words.forEach(w => {
            const k = w.word.toLowerCase();
            if (!S.dex[k]) {
                S.dex[k] = { word: w.word, pos: w.pos || '', ipa: w.ipa || '', mean: w.mean, example: w.example || '', trans: w.trans || '', distractors: w.distractors || [], rarity: w.rarity, region: p.region.id, caught: Date.now(), correct: 1, wrong: 0, seen: Date.now(), ...(w.parts ? { parts: w.parts, partMeans: w.partMeans } : {}),
                    // 關卡中答錯過的單字：立刻進錯題本、今天就要複習
                    box: 1, due: p.wrongSet?.has(k) ? Date.now() : Date.now() + DAY, ...(p.wrongSet?.has(k) ? { lastWrong: Date.now(), wrong: 1 } : {}) };
                newCount++;
            }
        });
        coins = 10 + stars * 5 + (p.maxCombo >= 5 ? 10 : 0);
        xp = newCount * 8 + stars * 4;
        food = newCount;   // 每個新單字 = 1 顆單字蘋果
        S.foods.apple = (S.foods.apple || 0) + food;
        cheer(5 + stars * 3);
        bumpQuest('caught', newCount);
        bumpQuest('stages'); bumpStat('stages'); if (stars === 3) bumpStat('perfect');
        headline = stars === 3 ? '完美捕捉！' : '關卡完成！';
        extra = `<div class="mt-5 text-left"><div class="text-sm font-black mb-2">📖 收進圖鑑（${newCount} 個新單字）</div>
            <div class="flex flex-wrap gap-2">${p.words.map(w => `<span class="pill" style="background:${p.region.t};color:${p.region.cd}">${esc(w.word)}</span>`).join('')}</div></div>`;
        if (firstClear && p.idx === STAGES_PER_REGION - 1) extra += `<div class="mt-4 p-3 rounded-2xl text-sm font-black" style="background:var(--red-t);color:var(--red-d)">${p.region.boss} 魔王「${esc(p.region.bossName)}」出現在地圖上了！</div>`;
    } else if (p.kind === 'boss') {
        const pr = prog(p.region.id);
        const first = !pr.boss;
        pr.boss = true;
        stars = p.mistakes === 0 ? 3 : p.mistakes === 1 ? 2 : 1;
        coins = first ? 80 : 25;
        xp = first ? 60 : 20;
        S.foods.cake = (S.foods.cake || 0) + 1;
        cheer(20);
        headline = `擊敗了 ${p.region.bossName}！`;
        const ni = REGIONS.findIndex(r => r.id === p.region.id) + 1;
        const gotEgg = first && addEgg();
        extra = (gotEgg ? `<div class="mt-5 p-3 rounded-2xl font-black flex items-center justify-center gap-2" style="background:var(--orange-t);color:var(--orange-d)"><span class="text-3xl wiggle">🥚</span>魔王掉落了一顆怪獸蛋！</div>` : first ? '<div class="mt-5 text-sm" style="color:var(--muted)">孵蛋器滿了，這次沒拿到蛋</div>' : '')
            + '<div class="mt-2 text-sm" style="color:var(--muted)">還拿到了 🍰 草莓蛋糕 ×1</div>';
        extra += first && REGIONS[ni] ? `<div class="mt-5 p-3 rounded-2xl font-black" style="background:${REGIONS[ni].t};color:${REGIONS[ni].cd}">🗺️ 新區域解鎖：${REGIONS[ni].emoji} ${REGIONS[ni].name}</div>` : (first ? '<div class="mt-5 p-3 rounded-2xl font-black" style="background:#fff1c2;color:#8a6500">🏆 你打敗了所有魔王，是真正的單字大師！</div>' : '');
        if (first && REGIONS[ni]) G.mapRegion = REGIONS[ni].id;
    } else if (p.kind === 'review') {
        const right = p.done;
        coins = 0; xp = right * 2; food = 0;
        headline = '訓練完成！';
        extra = `<p class="mt-3 text-sm" style="color:var(--muted)">訓練時每答對一題就拿 🪙 2，並增加單字熟練度</p>`;
        stars = p.mistakes === 0 ? 3 : p.mistakes <= 2 ? 2 : 1;
    } else if (p.kind === 'grammar') {
        xp = p.done * 3;
        headline = `答對 ${p.done} / ${p.total} 題`;
        stars = p.done === p.total ? 3 : p.done >= p.total - 1 ? 2 : 1;
        if (p.done === p.total) { coins += 10; bumpStat('grammarPerfect'); }
    } else if (p.kind === 'fun') {
        const m = activeMon();
        cheer(15 + p.done * 3);
        addAffection(p.done >= 5 ? 3 : 2);
        xp = p.done;
        stars = p.mistakes === 0 ? 3 : p.mistakes <= 2 ? 2 : 1;
        headline = `${m.name} 玩得好開心！`;
        extra = `<p class="mt-3 text-sm" style="color:var(--muted)">😊 心情上升・💞 親密度上升</p>`;
    }

    S.coins += coins;
    const xpGain = xp ? addMonsterXP(xp) : 0;
    save();
    playSound('win');
    burst();

    $('play-head').innerHTML = '';
    $('play-body').innerHTML = `<div class="text-center pt-6 anim-in">
        <div class="text-5xl tracking-wider">${[1, 2, 3].map(i => `<span class="star-in" style="animation-delay:${i * .18}s;${i > stars ? 'filter:grayscale(1);opacity:.25' : ''}">⭐</span>`).join('')}</div>
        <div class="text-3xl font-black mt-4">${esc(headline)}</div>
        <div class="my-4">${monsterHTML(90, false)}</div>
        <div class="grid grid-cols-3 gap-2">
            <div class="card p-3"><div class="text-xl font-black" style="color:#a67c00">+${coins + (p.kind === 'review' ? p.done * 2 : p.kind === 'grammar' ? p.done * 3 : p.kind === 'fun' ? p.done : 0)}</div><div class="text-xs" style="color:var(--muted)">🪙 金幣</div></div>
            <div class="card p-3"><div class="text-xl font-black" style="color:var(--orange-d)">+${xpGain}</div><div class="text-xs" style="color:var(--muted)">⭐ 經驗</div></div>
            ${p.kind === 'stage' ? `<div class="card p-3"><div class="text-xl font-black" style="color:var(--red)">+${food}</div><div class="text-xs" style="color:var(--muted)">🍎 蘋果</div></div>`
                : `<div class="card p-3"><div class="text-xl font-black" style="color:var(--red)">${p.maxCombo}</div><div class="text-xs" style="color:var(--muted)">🔥 最高連擊</div></div>`}
        </div>
        ${extra}
    </div>`;
    const nextBtn = p.workshop ? `<button class="btn purple flex-[2]" onclick="startWorkshop()">🧩 再組一批</button>`
        : p.kind === 'stage' && p.idx < STAGES_PER_REGION - 1
        ? `<button class="btn flex-[2]" style="--c:${p.region.c};--cd:${p.region.cd}" onclick="startStage('${p.region.id}', ${p.idx + 1})">下一關 →</button>`
        : p.kind === 'stage' ? `<button class="btn red flex-[2]" onclick="startBoss('${p.region.id}')">挑戰魔王 ${p.region.boss}</button>`
        : p.kind === 'review' ? `<button class="btn purple flex-[2]" onclick="startReview()">再訓練一輪</button>`
        : p.kind === 'fun' ? `<button class="btn blue flex-[2]" onclick="startFun()">再玩一次</button>` : '';
    $('play-foot').innerHTML = `<div class="flex gap-2"><button class="btn white flex-1" onclick="closePlay()">${nextBtn ? '休息' : '完成'}</button>${nextBtn}</div>`;
    if (G.modalQueue.length) setTimeout(runModalQueue, 900);
    if (p.kind === 'stage' && p.idx < STAGES_PER_REGION - 1) fetchStageWords(p.region.id);
}

function renderChat() {
    const el = $('tab-chat');
    if (G.chat.started && el.querySelector('#chat-box')) return;
    G.chat.started = true;
    el.innerHTML = `
    <div class="flex items-center justify-between mt-1 mb-3"><h2 class="text-2xl font-black">💬 英文聊天</h2><button class="btn white sm" onclick="resetChat()">↺ 重來</button></div>
    <div class="flex gap-2 overflow-x-auto noscroll -mx-4 px-4 pb-3">${CHAT_SCENARIOS.map((s, i) => `<button class="chip ${s === G.chat.scenario ? 'active' : ''}" onclick="setScenario(${i})">${s.label}</button>`).join('')}</div>
    <div class="card p-3 text-sm mb-3" style="background:var(--blue-t);border-color:#b9d7f0;color:var(--blue-d)">💡 用英文回覆練對話（會幫你評分修正）；不會說就打中文問「…英文怎麼說」。每句都能餵怪獸 🍖</div>
    <div id="chat-box" class="space-y-3 pb-28"></div>
    <div class="fixed left-0 right-0 z-20" style="bottom:calc(64px + env(safe-area-inset-bottom))">
        <div class="max-w-xl mx-auto px-4 pb-2 pt-2" style="background:linear-gradient(transparent, var(--bg) 30%)">
            <div class="flex gap-2">
                ${SR ? `<button id="chat-mic" class="btn red px-3" onclick="chatVoice()" aria-label="語音輸入">🎤</button>
                <button id="chat-lang" class="btn white sm px-2" onclick="toggleChatLang()" title="切換語音辨識語言">${G.chat.lang === 'zh-TW' ? '中' : 'EN'}</button>` : ''}
                <input id="chat-input" class="field flex-1 min-w-0" placeholder="Type in English，或用中文問…" onkeydown="if(event.key==='Enter' && !event.isComposing) sendChat()">
                <button id="chat-send" class="btn blue" onclick="sendChat()" aria-label="送出">➤</button>
            </div>
        </div>
    </div>`;
    resetChat();
}

function toggleChatLang() {
    G.chat.lang = G.chat.lang === 'zh-TW' ? 'en-US' : 'zh-TW';
    $('chat-lang').textContent = G.chat.lang === 'zh-TW' ? '中' : 'EN';
    toast(G.chat.lang === 'zh-TW' ? '語音改成辨識中文（問「…英文怎麼說」）' : '語音改成辨識英文', 'info', 1800);
}

function chatVoice() {
    const btn = $('chat-mic'), input = $('chat-input');
    if (G.rec) { stopListen(); return; }
    btn.textContent = '👂'; btn.classList.add('wiggle');
    listen(G.chat.lang || 'en-US', (text, final) => {
        input.value = text;
        if (final) { bumpStat('voice'); playSound('tap'); stopListen(); }
    }, () => { const b = $('chat-mic'); if (b) { b.textContent = '🎤'; b.classList.remove('wiggle'); } if (isFinePointer()) input.focus(); });
}

function setScenario(i) { G.chat.scenario = CHAT_SCENARIOS[i]; G.chat.started = false; renderChat(); }

function resetChat() {
    const s = G.chat.scenario;
    G.chat.history = [
        { role: 'user', content: '[START] The role-play begins. Greet me in character.' },
        { role: 'assistant', content: JSON.stringify({ reply: s.hi[0], chinese: s.hi[1] }) }
    ];
    G.chat.busy = false;
    $('chat-box').innerHTML = '';
    addBotMsg({ reply: s.hi[0], chinese: s.hi[1] });
}

function botAvatar() { const m = activeMon(); return `<div class="text-3xl shrink-0" style="${emojiStyle(m)}">${m ? formOf(m).e : '🤖'}</div>`; }

function addBotMsg(d) {
    const reply = String(d.reply || '');
    const t = d.teaching;
    const corr = Array.isArray(d.corrections) ? d.corrections.filter(c => c?.original && c?.corrected) : [];
    const score = Number(d.score);
    const box = $('chat-box');
    box.insertAdjacentHTML('beforeend', `<div class="flex gap-2 items-start anim-in">${botAvatar()}
        <div class="card p-3 max-w-[85%]">
            ${t ? `<div class="p-3 rounded-xl mb-2" style="background:var(--orange-t)">
                <div class="text-xs font-black mb-1" style="color:var(--orange-d)">📚 你想說：${esc(t.meaning || '')}</div>
                ${(t.expressions || []).map(x => `<button class="block w-full text-left mt-1.5 border-0 bg-transparent p-0" onclick="speak(this.dataset.t)" data-t="${esc(x.english)}"><span class="font-black" style="color:var(--green-d)">🔊 ${esc(x.english)}</span><span class="block text-xs" style="color:var(--muted)">${esc(x.note || '')}</span></button>`).join('')}
                ${t.tip ? `<div class="text-xs mt-2" style="color:var(--purple-d)">💡 ${esc(t.tip)}</div>` : ''}
            </div>` : ''}
            <button class="text-left border-0 bg-transparent p-0 w-full" onclick="speak(this.dataset.t)" data-t="${esc(reply)}"><span class="font-black">${esc(reply)}</span> <span class="text-sm">🔊</span></button>
            ${d.chinese ? `<div class="text-sm mt-1" style="color:var(--muted)">${esc(d.chinese)}</div>` : ''}
            ${corr.length ? `<div class="mt-2 p-2 rounded-xl text-sm" style="background:var(--red-t)">${corr.map(c => `<div><s style="color:var(--red-d)">${esc(c.original)}</s> → <b style="color:var(--green-d)">${esc(c.corrected)}</b>${c.reason ? `<span class="block text-xs" style="color:var(--muted)">${esc(c.reason)}</span>` : ''}</div>`).join('')}</div>` : ''}
            ${d.feedback ? `<div class="text-xs mt-2" style="color:#8a6500">✨ ${esc(d.feedback)}</div>` : ''}
            ${Number.isFinite(score) && d.score !== null && d.score !== undefined ? `<div class="flex items-center gap-2 mt-2"><div class="bar flex-1" style="height:8px"><i style="width:${Math.max(0, Math.min(100, score))}%;background:${score >= 80 ? 'var(--green)' : score >= 60 ? 'var(--orange)' : 'var(--red)'}"></i></div><span class="text-sm font-black">${Math.round(score)}</span></div>` : ''}
        </div></div>`);
    box.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'end' });
    if (reply) speak(reply);
}

async function sendChat() {
    const input = $('chat-input');
    const msg = input.value.trim();
    if (!msg || G.chat.busy) return;
    if (!apiKey) return openKeyModal(true);
    G.chat.busy = true;
    $('chat-send').disabled = true;
    input.value = '';
    const zh = /[㐀-鿿]/.test(msg);
    const box = $('chat-box');
    box.insertAdjacentHTML('beforeend', `<div class="flex justify-end anim-in"><div class="p-3 rounded-2xl max-w-[80%] font-black text-white" style="background:var(--blue)">${esc(msg)}</div></div>`);
    box.insertAdjacentHTML('beforeend', `<div id="typing" class="flex gap-2 items-center">${botAvatar()}<div class="card px-4 py-3 wiggle" style="animation-iteration-count:infinite">💭</div></div>`);
    box.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'end' });
    const scenario = G.chat.scenario;
    const messages = [...G.chat.history, { role: 'user', content: `[${zh ? 'CHINESE' : 'ENGLISH'}] ${msg}` }];
    try {
        const res = await callClaude({ system: chatSystem(scenario.value), messages });
        if (G.chat.scenario !== scenario) return;
        let d; try { d = parseJSON(res.text); } catch { d = { reply: res.text }; }
        // 保留完整 content（含 thinking 區塊），讓多輪對話保持一致
        G.chat.history = [...messages, { role: 'assistant', content: res.content }];
        $('typing')?.remove();
        addBotMsg(d);
        cheer(4); S.coins += 1; bumpStat('chats'); markActive(); progressEggs(zh ? 0 : 1);
        if (!zh && d.score != null) { S.totals.answered++; if (Number(d.score) >= 80) S.totals.correct++; }
        save();
    } catch (e) {
        $('typing')?.remove();
        box.insertAdjacentHTML('beforeend', `<div class="text-center"><span class="pill" style="background:var(--red-t);color:var(--red-d)">⚠️ ${esc(e.message)}</span></div>`);
        input.value = msg;
        if (e.status === 401) openKeyModal();
    } finally {
        G.chat.busy = false;
        $('chat-send').disabled = false;
        if (isFinePointer()) input.focus();
    }
}

// ============================================================
// 聲音
// ============================================================
let voice = null;
function pickVoice() {
    const vs = (window.speechSynthesis?.getVoices() || []).filter(v => /^en[-_]/i.test(v.lang));
    if (!vs.length) return;
    voice = ['Google US English', 'Microsoft Aria', 'Microsoft Jenny', 'Samantha', 'Google UK English Female', 'Microsoft Zira'].map(n => vs.find(v => v.name.includes(n))).find(Boolean) || vs.find(v => /en-US/i.test(v.lang)) || vs[0];
}
if (window.speechSynthesis) { speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); }

function speak(text, rate) {
    if (!window.speechSynthesis || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    if (voice) u.voice = voice;
    u.lang = voice?.lang || 'en-US';
    u.rate = rate || S.rate || 0.85;
    setTimeout(() => speechSynthesis.speak(u), 60);
}

let actx = null;
function playSound(type) {
    if (!S.sound) return;
    try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        const seq = {
            correct: [[660, 0, .12], [990, .08, .16]],
            combo: [[660, 0, .1], [880, .07, .1], [1320, .14, .18]],
            wrong: [[240, 0, .16], [190, .12, .22]],
            tap: [[520, 0, .05]],
            pop: [[400, 0, .06], [700, .05, .08]],
            coin: [[988, 0, .08], [1319, .08, .25]],
            win: [[523, 0, .12], [659, .12, .12], [784, .24, .12], [1047, .36, .3]],
            levelup: [[392, 0, .1], [523, .1, .1], [659, .2, .1], [784, .3, .1], [1047, .4, .35]],
            fail: [[392, 0, .18], [330, .18, .18], [262, .36, .35]]
        }[type] || [];
        seq.forEach(([f, d, len]) => {
            const o = actx.createOscillator(), g = actx.createGain();
            o.type = type === 'wrong' || type === 'fail' ? 'triangle' : 'sine';
            o.frequency.value = f;
            const t = actx.currentTime + d;
            g.gain.setValueAtTime(.0001, t);
            g.gain.exponentialRampToValueAtTime(.16, t + .015);
            g.gain.exponentialRampToValueAtTime(.0001, t + len);
            o.connect(g).connect(actx.destination);
            o.start(t); o.stop(t + len + .02);
        });
    } catch {}
}

function burst() { if (window.confetti) confetti({ particleCount: 90, spread: 75, origin: { y: .55 }, colors: ['#58b947', '#ffc93c', '#ff9f1c', '#3b9ae1', '#8e6cef'] }); }

// ============================================================
// 鍵盤
// ============================================================
document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (G.modalOpen) { if (e.key === 'Escape' && !G.modalLocked) closeModal(); return; }
    const p = G.play;
    if (!p || $('play').classList.contains('hidden')) return;
    if (e.target.matches?.('input, select, textarea')) return;
    if (e.key === 'Escape') return confirmQuit();
    if (p.locked && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); return nextChallenge(); }
    if (p.phase === 'intro' && (e.key === 'Enter' || e.key === 'ArrowRight')) { e.preventDefault(); return introNext(); }
    if (p.phase === 'intro' && e.key.toLowerCase() === 'r') return speak(p.words[p.introIdx].word);
    if (p.phase !== 'quiz' || p.locked) return;
    const c = p.queue[p.qi];
    if (!c) return;
    if (c.type === 'spell') {
        if (/^[a-z]$/i.test(e.key)) return spellKey(e.key.toLowerCase());
        if (e.key === 'Backspace') { e.preventDefault(); return spellUndo(); }
        if (e.key === 'Enter') return spellCheck();
    } else if (c.type === 'combine') {
        if (/^[1-9]$/.test(e.key)) return combinePick(Number(e.key) - 1);
        if (e.key === 'Backspace') { e.preventDefault(); return combineUndo(); }
    } else if (/^[1-4]$/.test(e.key) && c.options?.[Number(e.key) - 1] !== undefined) {
        answerOption(Number(e.key) - 1);
    } else if (e.key.toLowerCase() === 'r' && c.w) speak(c.w.word);
});

// ============================================================
// 啟動
// ============================================================
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
ensureDaily();
save();
render();
// PWA：註冊離線快取、接住安裝提示
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker 註冊失敗', err));
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); G.installEvt = e; if (G.tab === 'me') renderMe(); });
window.addEventListener('appinstalled', () => { G.installEvt = null; toast('📲 已安裝到主畫面！', 'good'); if (G.tab === 'me') renderMe(); });
function isStandalone() { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
async function installApp() {
    if (!G.installEvt) return;
    G.installEvt.prompt();
    await G.installEvt.userChoice.catch(() => null);
    G.installEvt = null;
    if (G.tab === 'me') renderMe();
}

if (!S.mons.length) {
    starterModal();
    if (!apiKey) G.modalQueue.push(() => openKeyModal(true));
} else if (!apiKey) setTimeout(() => openKeyModal(true), 400);
</script>
